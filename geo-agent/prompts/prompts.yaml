# GEO prompt set + content targets.
#
# Prompts, clusters, baseline mention rates and competitor shares are taken from
# the repo's real Peec tracking export
# (data/peec/tracked-prompts-2026-07-01_2026-08-05/prompt-metrics.csv).
#
# Each prompt carries:
#   mode: swap   -> LogBATT already shows up for this prompt in reality; the loop
#                   tests whether better content flips "retrieved-but-unnamed" to "named".
#         inject -> LogBATT barely shows up; the loop tests "if my page were
#                   retrieved, would I be named?" (a stronger assumption).
#   split: train -> feeds the Synthesizer.   val -> held out, scored only.
# facts / problem_frame_anchors are inherited from the target unless overridden.

brand:
  name: LogBATT
  aliases: [LogBATT GmbH, SafetyBATTbox, LogBATT]
  domain: logbatt.de

# Not competitors — never counted against us (see data/competitors/README.md).
partners:
  - lithiumsafetycontainers.nl

weights:
  mention: 0.35
  position: 0.20
  cited_from_candidate: 0.20
  problem_frame: 0.10
  claims: 0.15

targets:

  havarie:
    title: "Havarie & Notfall: kritisch defekte Lithium-Batterien sicher handhaben"
    cluster: "Havarie/Brand/Unfall"
    seed: corpus/logbatt/havarie-seed.md
    brand_voice: "sachlich, kompetent, B2B; Notfall-Kompetenz ohne Alarmismus"
    facts:
      - "24/7-Havarie-Erreichbarkeit"
      - "europaweite Abholung im Havariefall"
      - "Verfahrensfestlegung nach ADR 2025 P911/LP906"
      - "Entsorgungsfachbetrieb (EfB)"
      - "SafetyBATTbox Havarie- und Quarantänebehälter"
      - "Miete und Kauf"
    problem_frame_anchors:
      - "kritisch defekte Batterien"
      - "Havariefall"
      - "thermisches Durchgehen"
      - "kontaminiertes Löschwasser"
      - "Quarantäne"

  lagerung:
    title: "Lagerung von Lithium-Ionen-Batterien: Behälter, Container, Quarantäne"
    cluster: "Lagerung/Lagerbehälter"
    seed: corpus/logbatt/lagerung-seed.md
    brand_voice: "sachlich, kompetent, B2B; Fokus Produkt + Zertifizierung"
    facts:
      - "zertifizierte Transport-, Lager- und Quarantänebehälter"
      - "SafetyBATTbox (Größen S/M/L/XL)"
      - "Lithium Safety Container (10/20/40 Fuß, DACH-Vertrieb)"
      - "DIN EN ISO 9001/14001, QSP"
      - "Entsorgungsfachbetrieb (EfB)"
      - "Miete und Kauf"
    problem_frame_anchors:
      - "intakte, defekte und kritisch defekte Batterien"
      - "Quarantäne"
      - "Brandschutz"
      - "Lagerung und Laden"

prompts:

  # --- Havarie: train -------------------------------------------------------
  - id: hav-01
    target: havarie
    text: "Wer vermietet Havarieboxen für Lithium-Akkus?"
    intent: commercial
    split: train
    mode: swap
    baseline_mention_pct: 93
    competitors: {Paul Müller: 59, DENIOS: 46, RETRON: 24, Zieglmeier: 5, Zarges: 5}

  - id: hav-02
    target: havarie
    text: "Wo bekomme ich Havariecontainer für Lithium-Akkus zur Miete?"
    intent: commercial
    split: train
    mode: swap
    baseline_mention_pct: 83
    competitors: {DENIOS: 60, Paul Müller: 23, Zieglmeier: 2, RETRON: 1}

  - id: hav-03
    target: havarie
    text: "Welcher Dienstleister ist auf die Entsorgung von Lithium-Batterien nach Havariefällen spezialisiert?"
    intent: commercial
    split: train
    mode: swap
    baseline_mention_pct: 76
    competitors: {RETRON: 91, DellCon: 9, DENIOS: 2, Paul Müller: 2}

  - id: hav-04
    target: havarie
    text: "Welche Havariekiste eignet sich für die Lagerung von Lithium-Batterien?"
    intent: informational
