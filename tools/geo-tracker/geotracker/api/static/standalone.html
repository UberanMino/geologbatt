<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO-Visibility-Tracker · LogBATT</title>
<style>
:root{
  --bg:#f7f8f9; --panel:#fff; --line:#e5e7eb; --line-soft:#eef0f3;
  --ink:#111418; --ink-2:#3f4650; --muted:#6b7280; --sidebar:#fbfbfc;
  --accent:#0f766e; --on-accent:#fff; --accent-soft:#e6f2f0;
  --good:#0f766e; --bad:#b91c1c; --warn:#b45309;
  --you:#0f766e; --competitor:#b45309; --corporate:#5b6470; --institutional:#2563eb;
  --ugc:#7c3aed; --editorial:#db2777; --reference:#0891b2; --marketplace:#ca8a04;
  --other:#9ca3af;
  --r:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1014; --panel:#15191f; --line:#252b34; --line-soft:#1e232b;
    --ink:#e8ebef; --ink-2:#b8c0cb; --muted:#8d97a5; --sidebar:#11151a;
    --accent:#2dd4bf; --on-accent:#06120f; --accent-soft:#12302c;
    --good:#2dd4bf; --bad:#f87171; --warn:#fbbf24;
    --you:#2dd4bf; --competitor:#fbbf24; --corporate:#94a3b8; --institutional:#60a5fa;
    --ugc:#a78bfa; --editorial:#f472b6; --reference:#22d3ee; --marketplace:#facc15;
    --other:#6b7480;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1014; --panel:#15191f; --line:#252b34; --line-soft:#1e232b;
  --ink:#e8ebef; --ink-2:#b8c0cb; --muted:#8d97a5; --sidebar:#11151a;
  --accent:#2dd4bf; --on-accent:#06120f; --accent-soft:#12302c;
  --good:#2dd4bf; --bad:#f87171; --warn:#fbbf24;
  --you:#2dd4bf; --competitor:#fbbf24; --corporate:#94a3b8; --institutional:#60a5fa;
  --ugc:#a78bfa; --editorial:#f472b6; --reference:#22d3ee; --marketplace:#facc15;
  --other:#6b7480;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}

/* ---------- Sidebar ---------- */
aside{background:var(--sidebar);border-right:1px solid var(--line);padding:14px 10px;
  position:sticky;top:0;height:100vh;overflow:auto}
.brandmark{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:660;
  font-size:14px;letter-spacing:-.01em}
.brandmark span{width:20px;height:20px;border-radius:5px;background:var(--accent);
  color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.projectpick{padding:0 4px 8px}
.projectpick select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:650;padding:12px 8px 5px}
aside a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
  color:var(--ink-2);text-decoration:none;font-weight:520;cursor:pointer}
aside a:hover{background:var(--line-soft)}
aside a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:620}
aside a i{width:14px;text-align:center;font-style:normal;opacity:.75;font-size:12px}
.sidefoot{margin-top:18px;padding:10px 8px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);line-height:1.45}

/* ---------- Topbar ---------- */
main{min-width:0}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
.crumb{font-weight:620;font-size:13.5px;display:flex;align-items:center;gap:6px}
.crumb .sep{color:var(--muted);font-weight:400}
.spacer{flex:1}
.chip{position:relative}
.chip>button{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);
  font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip>button:hover{background:var(--line-soft)}
.chip>button[data-on="1"]{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft);font-weight:600}
.chip .caret{opacity:.5;font-size:9px}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.14);
  padding:8px;min-width:240px;max-height:340px;overflow:auto}
.pop label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;
  cursor:pointer;font-size:13px}
.pop label:hover{background:var(--line-soft)}
.pop input[type=checkbox]{width:auto;margin:0}
.pop .popfoot{display:flex;gap:6px;padding-top:7px;margin-top:6px;border-top:1px solid var(--line)}
.pop .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
input[type=date],input[type=text],select{padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;width:100%}
button.mini{padding:4px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
  color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
button.mini.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
:is(a,button,input,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Content ---------- */
.page{padding:16px 18px 64px;max-width:1560px}
.h{margin:0 0 2px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.hsub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card,.row+.row,.card+.row,.row+.card{margin-top:14px}
.card h3{margin:0 0 2px;font-size:13.5px;font-weight:630}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:11px}
.row{display:grid;gap:14px}
.r-2-1{grid-template-columns:1.35fr 1fr}
.r-1-1{grid-template-columns:1fr 1fr}
@media(max-width:1150px){.r-2-1,.r-1-1{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.kpirow>div{padding:12px 14px;border-right:1px solid var(--line)}
.kpirow>div:last-child{border-right:0}
.kpirow .k{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.kpirow .v{font-size:22px;font-weight:660;letter-spacing:-.02em;margin-top:3px;
  display:flex;align-items:baseline;gap:7px}
.d{font-size:11.5px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted);font-weight:500}

table{border-collapse:collapse;width:100%;font-size:12.8px}
.scroll{overflow-x:auto}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:640;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.idx{color:var(--muted);font-variant-numeric:tabular-nums;width:26px}
.pill{display:inline-block;padding:1.5px 8px;border-radius:99px;font-size:10.5px;font-weight:640;
  border:1px solid currentColor;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:6px;vertical-align:1px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:52px}
.bar>span{display:block;height:100%;background:var(--accent)}
.hbar{display:flex;align-items:center;gap:9px;padding:4.5px 0}
.hbar .track{flex:1;height:22px;border-radius:6px;background:var(--line-soft);position:relative;
  overflow:hidden;cursor:pointer}
/* Die Füllung ist bewusst `span.fill` und nicht `.track>span`: sonst greift die
   Regel auch aufs Label und überschreibt dessen Position (höhere Spezifität). */
.hbar .track>span.fill{position:absolute;inset:0 auto 0 0;
  background:color-mix(in srgb, var(--accent) 20%, transparent);
  border-right:2px solid var(--accent)}
.hbar .track>span.lbl{position:absolute;left:9px;right:9px;top:0;bottom:0;
  display:flex;align-items:center;gap:6px;font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track>span.lbl>*{flex:none}
.hbar .track>span.lbl>b.t{flex:0 1 auto;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .val{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.engs{display:flex;gap:4px;white-space:nowrap}
.more{padding:11px 0 2px;text-align:center}
.more button{border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:7px;padding:5px 13px;font:inherit;font-size:12px;cursor:pointer}
.more button:hover{background:var(--line-soft);color:var(--ink)}
.tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin-bottom:11px}
.tabs button{border:0;background:none;padding:6px 0;color:var(--muted);font:inherit;
  font-size:12.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:3.5px 9px;font:inherit;
  font-size:11.5px;font-weight:600;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.avatars{display:inline-flex}
.av{width:19px;height:19px;border-radius:99px;display:grid;place-items:center;font-size:9px;
  font-weight:700;color:#fff;border:1.5px solid var(--panel);margin-left:-5px}
.av:first-child{margin-left:0}
.empty{color:var(--muted);padding:26px;text-align:center;font-size:12.5px}
.link{color:var(--accent);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.trunc{max-width:460px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
details.chat{border-bottom:1px solid var(--line-soft)}
details.chat summary{padding:9px 0;cursor:pointer;font-size:12.8px;list-style:none;
  display:flex;gap:10px;align-items:center}
details.chat summary::-webkit-details-marker{display:none}
pre.answer{white-space:pre-wrap;font:11.8px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;
  max-height:340px;overflow:auto;margin:4px 0 12px}
.hm td{text-align:center;font-variant-numeric:tabular-nums;font-size:12px;padding:6px 4px;
  border:1px solid var(--panel)}
.hm th:first-child,.hm td:first-child{text-align:left;white-space:nowrap}
.rank{padding:6px 8px;border-radius:7px;font-size:12px;background:var(--line-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank.me{background:var(--accent-soft);color:var(--accent);font-weight:650}
.note{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 13px;margin-bottom:14px;font-size:12.5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:9px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brandmark"><span>LB</span> LogBATT</div>
    <div class="projectpick" id="projectpick"></div>
    <a data-route="intro"><i>❋</i>Über das Tool</a>
    <div class="navgroup">Allgemein</div>
    <a data-route="overview"><i>◧</i>Overview</a>
    <a data-route="prompts"><i>≡</i>Prompts</a>
    <div class="navgroup">Quellen</div>
    <a data-route="domains"><i>◍</i>Domains</a>
    <a data-route="urls"><i>⛓</i>URLs</a>
    <a data-route="gap"><i>◔</i>Gap-Analyse</a>
    <div class="navgroup">Marke</div>
    <a data-route="insights"><i>◆</i>Insights</a>
    <a data-route="brands"><i>▦</i>Wettbewerber</a>
    <div class="navgroup">System</div>
    <a data-route="projects"><i>▤</i>Projekte</a>
    <a data-route="settings"><i>⚙</i>Einstellungen</a>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<script>
// ===========================================================================
// Speicher-Layer (nur Browser). Projekte und API-Schlüssel liegen lokal in
// localStorage — nichts davon verlässt je den Rechner oder landet im HTML.
// ===========================================================================
const STORE = {
  reg: 'geo.projects', active: 'geo.active', seeded: 'geo.seeded',
  proj: id => 'geo.project.' + id, key: name => 'geo.apikey.' + name,
  builtin: '__builtin__',
};
function lsGet(k)   { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k)   { try { localStorage.removeItem(k); } catch (e) {} }

// Datensatz des aktiven Projekts (oder null -> eingebautes Projekt).
function activeProjectData() {
  const id = lsGet(STORE.active);
  if (!id || id === STORE.builtin) return null;
  const raw = lsGet(STORE.proj(id));
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

// ===========================================================================
// Eingebetteter Datenstand — wird von `geotracker export-html` ersetzt.
// Er ist das eingebaute Projekt; weitere Projekte liegen in localStorage.
// Alles rechnet im Browser: keine Netzwerkaufrufe für die Auswertung.
// ===========================================================================
const EMBEDDED = /*__GEO_DATA__*/null;
const D = activeProjectData() || EMBEDDED;

const PROMPT = new Map(D.prompts.map(p => [p.id, p]));
const BRAND  = new Map(D.brands.map(b => [b.id, b]));
const OWN    = D.brands.find(b => b.own) || {};
const DOMS   = D.domains || {};

// Citation-Tupel: [0]=domain [1]=url [2]=source_type [3]=url_known
//                 [4]=rank [5]=title [6]=is_known [7]=url_type
const C_DOM=0, C_URL=1, C_STYPE=2, C_UKNOWN=3, C_RANK=4, C_TITLE=5, C_KNOWN=6, C_UTYPE=7;

const ENGINE_LABEL = { chatgpt:'ChatGPT', perplexity:'Perplexity', gemini:'Gemini',
                       google_ai_overview:'Google AI Overview' };
const DTYPE_LABEL = { you:'Eigene', competitor:'Wettbewerber', corporate:'Corporate',
  institutional:'Institutionell', ugc:'UGC', editorial:'Redaktionell',
  reference:'Referenz', marketplace:'Marktplatz', other:'Sonstige' };
const UTYPE_LABEL = { homepage:'Startseite', product_page:'Produktseite',
  category_page:'Kategorieseite', article:'Artikel', how_to:'Ratgeber',
  listicle:'Listicle', profile:'Profil', other:'Sonstige', unknown:'Unbekannt' };
const PALETTE = ['#0f766e','#b45309','#2563eb','#7c3aed','#db2777','#0891b2','#ca8a04','#64748b'];

let ROUTE = 'overview', DETAIL = null;
const F = { since:null, until:null, engine:[], category:[], brand:[], domain:[],
            country:[], source:[], dtype:[], utype:[], q:'' };

// ---------------------------------------------------------------------------
// Filter — Facetten UND-verknüpft, Mehrfachauswahl innerhalb einer Facette ODER
// ---------------------------------------------------------------------------
function runsFor(over) {
  const f = Object.assign({}, F, over || {});
  return D.runs.filter(r => {
    const p = PROMPT.get(r.p);
    if (f.since && r.d < f.since) return false;
    if (f.until && r.d > f.until) return false;
    if (f.engine.length   && !f.engine.includes(r.e)) return false;
    if (f.category.length && !f.category.includes(p.cat)) return false;
    if (f.country.length  && !f.country.includes(p.country)) return false;
    if (f.source.length   && !f.source.includes(r.s)) return false;
    if (f.brand.length    && !r.b.some(b => f.brand.includes(b[0]))) return false;
    if (f.domain.length   && !r.c.some(c => f.domain.includes(c[C_DOM]))) return false;
    if (f.dtype.length    && !r.c.some(c => f.dtype.includes(dtypeOf(c)))) return false;
    if (f.utype.length    && !r.c.some(c => f.utype.includes(c[C_UTYPE]))) return false;
    return true;
  });
}
const dtypeOf = c => (DOMS[c[C_DOM]] || {}).dtype || 'other';

function prevWindow() {
  if (!F.since || !F.until) return null;
  const day = 864e5, a = new Date(F.since), b = new Date(F.until);
  const len = Math.round((b - a) / day) + 1;
  const pe = new Date(a - day), ps = new Date(pe - (len - 1) * day);
  const iso = d => d.toISOString().slice(0, 10);
  return { since: iso(ps), until: iso(pe) };
}

// ---------------------------------------------------------------------------
// Kennzahlen
// ---------------------------------------------------------------------------
// Sentiment als 0-100-Score wie bei Peec: positiv 80, neutral 50, negativ 20.
// Läufe ohne Sentiment (Peec-Import liefert keins) zählen nicht mit.
const SENT_SCORE = { positive:80, neutral:50, negative:20 };

function kpis(runs) {
  const ev = runs.filter(r => r.m !== null);
  const men = ev.filter(r => r.m === 1);
  const pos = men.map(r => r.pos).filter(v => v != null);
  const sent = ev.map(r => SENT_SCORE[r.sen]).filter(v => v != null);
  let own = 0, all = 0;
  const cit = { total:0, you:0, competitor:0 };
  for (const r of runs) {
    for (const b of r.b) { all++; if (b[0] === OWN.id) own++; }
    for (const c of r.c) { cit.total++; const t = dtypeOf(c);
      if (t === 'you') cit.you++; if (t === 'competitor') cit.competitor++; }
  }
  return {
    runs: runs.length, evaluated: ev.length,
    visibility: ev.length ? men.length / ev.length : null,
    position: pos.length ? pos.reduce((a,b)=>a+b,0)/pos.length : null,
    sov: all ? own / all : null,
    sentiment: sent.length ? sent.reduce((a,b)=>a+b,0)/sent.length : null,
    pn: ev.length ? ev.filter(r => r.pn === 1).length / ev.length : null,
    citations: cit.total, ownCitations: cit.you,
  };
}

function byDay(runs) {
  const m = new Map();
  for (const r of runs) { if (!m.has(r.d)) m.set(r.d, []); m.get(r.d).push(r); }
  return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0]));
}

function brandTable(runs) {
  const evaluated = runs.filter(r => r.m !== null).length;
  const m = new Map(); let total = 0;
  for (const r of runs) for (const b of r.b) {
    total++;
    if (!m.has(b[0])) m.set(b[0], { id:b[0], mentions:0, runs:new Set(), rank:0, sent:[] });
    const e = m.get(b[0]); e.mentions++; e.runs.add(r.id); e.rank += b[1];
    if (b[0] === OWN.id && SENT_SCORE[r.sen] != null) e.sent.push(SENT_SCORE[r.sen]);
  }
  return [...m.values()].map(e => {
    const b = BRAND.get(e.id) || { name:'?' };
    return { ...b, id:e.id, mentions:e.mentions, runCount:e.runs.size,
      visibility: evaluated ? e.runs.size/evaluated : null,
      sov: total ? e.mentions/total : null,
      position: e.rank/e.mentions,
      sentiment: e.sent.length ? e.sent.reduce((a,b)=>a+b,0)/e.sent.length : null };
  }).sort((a,b) => b.visibility - a.visibility || b.mentions - a.mentions);
}

function sourceRows(runs, mode /* 'domain' | 'url' */) {
  const m = new Map();
  for (const r of runs) for (const c of r.c) {
    if (mode === 'url' && !c[C_UKNOWN]) continue;
    const key = mode === 'url' ? c[C_URL] : c[C_DOM];
    if (!m.has(key)) m.set(key, { key, domain:c[C_DOM], url:c[C_URL], title:c[C_TITLE],
      dtype:dtypeOf(c), utype:c[C_UTYPE], stype:c[C_STYPE], known:c[C_KNOWN],
      retrievals:0, runs:new Set(), prompts:new Set(), rank:0, withMention:0, first:r.d });
    const e = m.get(key);
    e.retrievals++; e.runs.add(r.id); e.prompts.add(r.p); e.rank += c[C_RANK];
    if (r.m === 1) e.withMention++;
    if (r.d < e.first) e.first = r.d;
  }
  const totalRuns = runs.length || 1;
  return [...m.values()].map(e => ({
    ...e, runCount:e.runs.size, promptCount:e.prompts.size,
    avgRank: e.rank / e.retrievals,
    retrievedRate: e.runs.size / totalRuns,          // Anteil der Läufe mit dieser Quelle
    citationRate: e.retrievals / e.runs.size,        // Ø Zitate je Lauf, in dem sie vorkommt
    mentionRate: e.runs.size ? e.withMention / e.runs.size : 0,
  })).sort((a,b) => b.retrievals - a.retrievals);
}

// Top / Neu / Steigend / Fallend — immer gegen den gleich langen Vorzeitraum.
function movers(mode, which) {
  const now = sourceRows(runsFor(), mode);
  const pw = prevWindow();
  const before = pw ? new Map(sourceRows(runsFor(pw), mode).map(r => [r.key, r.retrievals]))
                    : new Map();
  const withDelta = now.map(r => ({ ...r, prev: before.get(r.key) || 0,
                                    delta: r.retrievals - (before.get(r.key) || 0) }));
  if (which === 'new')      return withDelta.filter(r => r.prev === 0).sort((a,b) => b.retrievals - a.retrievals);
  if (which === 'up')       return withDelta.filter(r => r.prev > 0 && r.delta > 0).sort((a,b) => b.delta - a.delta);
  if (which === 'down')     return withDelta.filter(r => r.delta < 0).sort((a,b) => a.delta - b.delta);
  return withDelta;
}

function typeDistribution(runs, mode) {
  const m = new Map(); let total = 0;
  for (const r of runs) for (const c of r.c) {
    if (mode === 'url' && !c[C_UKNOWN]) continue;
    const key = mode === 'url' ? c[C_UTYPE] : dtypeOf(c);
    m.set(key, (m.get(key) || 0) + 1); total++;
  }
  return { total, rows: [...m.entries()].map(([key, n]) => ({ key, n, share: n/total }))
    .sort((a,b) => b.n - a.n) };
}

// Gap: Quellen, die auftauchen, während LogBATT NICHT genannt wird.
// Eigene Definition (Peecs Formel ist nicht öffentlich) — bewusst simpel und
// nachrechenbar: gap = Zitate in Läufen ohne LogBATT-Nennung.
function gapRows(runs, mode) {
  const rows = sourceRows(runs, mode);
  return rows.map(r => ({ ...r, gap: r.retrievals - Math.round(r.retrievals * r.mentionRate) }))
    .filter(r => r.dtype !== 'you' && r.gap > 0)
    .sort((a,b) => b.gap - a.gap);
}

// ---------------------------------------------------------------------------
// Formatierung + Bausteine
// ---------------------------------------------------------------------------
const pct  = v => v == null ? '–' : (v*100).toFixed(0) + ' %';
const pct1 = v => v == null ? '–' : (v*100).toFixed(1) + ' %';
const nm   = (v,d=1) => v == null ? '–' : Number(v).toFixed(d).replace('.', ',');
const esc  = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = s => (s||'?').replace(/[^A-Za-zÄÖÜäöü ]/g,'').split(/\s+/).slice(0,2)
                        .map(w=>w[0]||'').join('').toUpperCase() || '?';
const brandColor = id => PALETTE[[...BRAND.keys()].indexOf(id) % PALETTE.length];

// Delta nur, wenn BEIDE Werte existieren. Ein leeres Vorperioden-Fenster darf
// nicht als "+64 %" durchgehen — dann ist die Veränderung schlicht unbekannt.
function diff(now, before) {
  return (now == null || before == null || before === false) ? null : now - before;
}
function delta(v, invert, fmt) {
  if (v == null || Math.abs(v) < 1e-9) return '<span class="d flat">–</span>';
  const better = invert ? v < 0 : v > 0;
  return `<span class="d ${better?'up':'down'}">${v>0?'+':''}${(fmt||pct1)(v)}</span>`;
}
function typePill(key, label) {
  return `<span class="pill" style="color:var(--${key.replace(/_/g,'-')},var(--other))">${esc(label||key)}</span>`;
}
// Lange Tabellen werden seitenweise gezeigt (opts.page = Schlüssel). Gefiltert
// und sortiert wird immer über den GESAMTEN Bestand — begrenzt ist nur, wie
// viele Zeilen gerendert werden.
const PAGED = {};
window.showMore = key => { PAGED[key] = (PAGED[key] || 50) + 50; render(); };

function tbl(cols, rows, opts) {
  opts = opts || {};
  if (!rows.length) return `<div class="empty">${opts.empty || 'Keine Daten in dieser Auswahl.'}</div>`;
  const total = rows.length;
  let shown = rows, more = '';
  if (opts.page) {
    const n = PAGED[opts.page] || 50;
    shown = rows.slice(0, n);
    if (total > n) more = `<div class="more"><button onclick="showMore('${opts.page}')">
      Weitere ${Math.min(50, total-n)} von ${total} anzeigen</button></div>`;
  }
  return `<div class="scroll"><table><thead><tr>${
    cols.map(c => `<th class="${c.num?'num':''}">${esc(c.t)}</th>`).join('')
  }</tr></thead><tbody>${
    shown.map((r,i) => `<tr>${cols.map(c => `<td class="${c.num?'num':''}">${c.r(r,i)}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>${more}`;
}
function hbars(items, onclick) {
  if (!items.length) return '<div class="empty">Keine Quellen in dieser Auswahl.</div>';
  const max = items[0].value || 1;
  return items.map(it => `<div class="hbar">
      <div class="track" ${onclick?`onclick="${onclick}('${esc(it.key)}')"`:''}>
        <span class="fill" style="width:${Math.max(3, it.value/max*100)}%"></span>
        <span class="lbl">${it.label}</span></div>
      <div class="val">${it.value}${it.delta!=null&&it.delta!==0?
        ` <span class="d ${it.delta>0?'up':'down'}">${it.delta>0?'+':''}${it.delta}</span>`:''}</div>
    </div>`).join('');
}
function lineChart(series, o) {
  o = o || {};
  const H = o.height || 200, W = 940, pad = { l:44, r:14, t:12, b:24 };
  if (!series.length || series[0].x.length < 2)
    return '<div class="empty">Zu wenige Tage für eine Zeitreihe.</div>';
  const n = series[0].x.length, yMax = o.yMax || 1;
  const X = i => pad.l + i*(W-pad.l-pad.r)/Math.max(1,n-1);
  const Y = v => { const t = Math.max(0, Math.min(1, v/yMax));
                   return pad.t + (o.invert ? t : 1-t)*(H-pad.t-pad.b); };
  const fmt = o.fmt || pct;
  const grid = [0,.25,.5,.75,1].map(t => { const v=t*yMax; return `
    <line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".1"/>
    <text x="${pad.l-7}" y="${Y(v)+4}" text-anchor="end" font-size="10" opacity=".5">${fmt(v)}</text>`;
  }).join('');
  const xlab = series[0].x.map((d,i) => (i % Math.ceil(n/7) === 0 || i === n-1)
    ? `<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" opacity=".5">${esc(d.slice(5).replace('-','.'))}</text>` : '').join('');
  const paths = series.map(s => {
    const d = s.y.map((v,i) => v==null ? null
      : `${i && s.y[i-1]!=null ? 'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.9"
      stroke-linejoin="round" stroke-linecap="round"/>` +
      s.y.map((v,i) => v==null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="2.4" fill="${s.color}">
        <title>${esc(s.name)} · ${esc(s.x[i])}: ${fmt(v)}</title></circle>`).join('');
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;color:var(--ink)">
    ${grid}${xlab}${paths}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// Filterleiste (Chips mit Popover — wie in Peec)
// ---------------------------------------------------------------------------
const DATE_PRESETS = [['all','Gesamter Zeitraum'],['7','Letzte 7 Tage'],['14','Letzte 14 Tage'],['30','Letzte 30 Tage']];
let OPEN_POP = null;
const _SPAN_DATES = D.runs.map(r=>r.d).sort();
const _TODAY = (D.generated_at || new Date().toISOString()).slice(0,10);
const SPAN = { min: _SPAN_DATES[0] || _TODAY, max: _SPAN_DATES[_SPAN_DATES.length-1] || _TODAY };

function facetOptions(key) {
  const count = new Map();
  const bump = v => count.set(v, (count.get(v)||0)+1);
  for (const r of D.runs) {
    const p = PROMPT.get(r.p);
    if (key === 'engine') bump(r.e);
    else if (key === 'category') bump(p.cat);
    else if (key === 'country') bump(p.country);
    else if (key === 'source') bump(r.s);
    else if (key === 'brand') for (const b of new Set(r.b.map(x=>x[0]))) bump(b);
    else if (key === 'domain') for (const d of new Set(r.c.map(c=>c[C_DOM]))) bump(d);
    else if (key === 'dtype') for (const t of new Set(r.c.map(dtypeOf))) bump(t);
  }
  const label = v => key==='engine' ? (ENGINE_LABEL[v]||v)
    : key==='brand' ? (BRAND.get(v)||{}).name + ((BRAND.get(v)||{}).own ? ' ★':'')
    : key==='dtype' ? DTYPE_LABEL[v]||v : String(v);
  return [...count.entries()].sort((a,b) => b[1]-a[1] || String(a[0]).localeCompare(String(b[0])))
    .map(([v,n]) => ({ value:v, label:label(v), n }));
}

function chip(key, allLabel, opts) {
  const sel = F[key];
  const on = sel.length > 0;
  const text = !on ? allLabel : sel.length === 1
    ? (opts.find(o => String(o.value) === String(sel[0])) || {}).label || allLabel
    : `${allLabel} · ${sel.length}`;
  return `<div class="chip" data-chip="${key}">
    <button data-on="${on?1:0}" onclick="togglePop('${key}')">${esc(text)}<span class="caret">▼</span></button>
    ${OPEN_POP===key ? `<div class="pop">
      ${opts.map(o => `<label><input type="checkbox" value="${esc(o.value)}"
        ${sel.map(String).includes(String(o.value))?'checked':''}
        onchange="toggleFacet('${key}', this.value, this.checked)">
        <span>${esc(o.label)}</span><span class="cnt">${o.n}</span></label>`).join('')}
      <div class="popfoot"><button class="mini" onclick="clearFacet('${key}')">Zurücksetzen</button>
      <button class="mini" onclick="togglePop(null)">Fertig</button></div></div>` : ''}
  </div>`;
}

function dateChip() {
  const label = (F.since === SPAN.min && F.until === SPAN.max)
    ? 'Gesamter Zeitraum' : `${F.since} – ${F.until}`;
  return `<div class="chip" data-chip="date">
    <button data-on="${label==='Gesamter Zeitraum'?0:1}" onclick="togglePop('date')">${esc(label)}<span class="caret">▼</span></button>
    ${OPEN_POP==='date' ? `<div class="pop" style="min-width:250px">
      ${DATE_PRESETS.map(([v,l]) => `<label onclick="setPreset('${v}')"><span>${l}</span></label>`).join('')}
      <div style="display:flex;gap:6px;padding:8px 4px 2px">
        <input type="date" id="dfrom" value="${F.since}"><input type="date" id="dto" value="${F.until}">
      </div>
      <div class="popfoot"><button class="mini" onclick="applyDates()">Übernehmen</button></div></div>` : ''}
  </div>`;
}

window.togglePop = k => { OPEN_POP = (OPEN_POP === k ? null : k); renderChips(); };
window.toggleFacet = (k, v, on) => {
  const val = (k === 'brand') ? Number(v) : v;
  F[k] = on ? [...F[k], val] : F[k].filter(x => String(x) !== String(v));
  renderChips(); render();
};
window.clearFacet = k => { F[k] = []; renderChips(); render(); };
window.setPreset = v => {
  if (v === 'all') { F.since = SPAN.min; F.until = SPAN.max; }
  else { const d = new Date(SPAN.max); d.setDate(d.getDate() - (Number(v)-1));
         F.since = d.toISOString().slice(0,10) < SPAN.min ? SPAN.min : d.toISOString().slice(0,10);
         F.until = SPAN.max; }
  OPEN_POP = null; renderChips(); render();
};
window.applyDates = () => {
  F.since = document.getElementById('dfrom').value || SPAN.min;
  F.until = document.getElementById('dto').value || SPAN.max;
  OPEN_POP = null; renderChips(); render();
};

function renderChips() {
  document.getElementById('chips').innerHTML =
    dateChip()
    + chip('engine',   'Alle Modelle',      facetOptions('engine'))
    + chip('category', 'Alle Themen',       facetOptions('category'))
    + chip('brand',    'Alle Marken',       facetOptions('brand'))
    + chip('dtype',    'Alle Quellentypen', facetOptions('dtype'))
    + chip('domain',   'Alle Domains',      facetOptions('domain').slice(0, 120))
    + chip('source',   'Alle Datenquellen', facetOptions('source'));
}
document.addEventListener('click', e => {
  if (OPEN_POP && !e.target.closest('.chip')) { OPEN_POP = null; renderChips(); }
});

  </div>

  <div class="row r-2-1">

      <h3>Visibility</h3><div class="sub">Anteil der Antworten, in denen die Marke vorkommt</div>

          <span class="lbl">${DTYPE_LABEL[r.key]||r.key}</span></div>

        { t:'', r:r=>`<div class="bar" style="width:56px"><span style="width:${(r.visibility||0)*100}%"></span></div>` },
        { t:'Sentiment', num:true, r:r=>r.sentiment==null?'–':nm(r.sentiment,0) },
        { t:'Position', num:true, r:r=>r.position==null?'–':'#'+nm(r.position,1) },
        { t:'Marken', r:r=>`<span class="avatars">${r.brands.slice(0,3).map(id=>{
            const b=BRAND.get(id)||{}; return `<span class="av" title="${esc(b.name)}"
            style="background:${b.own?'var(--accent)':brandColor(id)}">${esc(initials(b.name))}</span>`;}).join('')}
            ${r.brands.length>3?`<span class="av" style="background:var(--other)">+${r.brands.length-3}</span>`:''}</span>` },
        { t:'Modelle', r:r=>`<span class="engs">${r.models.map(m=>
            `<span class="pill" style="color:var(--muted)" title="${esc(ENGINE_LABEL[m]||m)}"
              >${esc((ENGINE_LABEL[m]||m).slice(0,2))}</span>`).join('')}</span>` },
        { t:'Thema', r:r=>esc(r.p.cat) },
        { t:'Branding', r:r=>`<span class="pill" style="color:var(--muted)">${esc(r.p.branding)}</span>` },
        { t:'Läufe', num:true, r:r=>r.runs },
      ], rows, { empty:'Keine Prompts in dieser Auswahl.' })}
    </div>
  </div>`;
}

function promptDetail(id) {
  const p = PROMPT.get(id);
  const runs = runsFor({ }).filter(r => r.p === id).sort((a,b) => b.d.localeCompare(a.d));
  const k = kpis(runs);
  return `
  <div style="margin-bottom:10px"><span class="link" onclick="DETAIL=null;render()">← Prompts</span></div>
  <h1 class="h">${esc(p.text)}</h1>
  <div class="hsub">${esc(p.cat)} · ${p.country}/${p.lang} · ${esc(p.branding)} · ${runs.length} Läufe</div>
  <div class="kpirow" style="margin-bottom:14px">
    ${[['Visibility',pct1(k.visibility)],['Ø Position',nm(k.position,2)],
       ['Share of Voice',pct1(k.sov)],['Zitate',k.citations]]
      .map(([a,b])=>`<div><div class="k">${a}</div><div class="v">${b}</div></div>`).join('')}
  </div>
  <div class="card"><h3>Antwort-Historie</h3>
    <div class="sub">Jeder Lauf mit Volltext, genannten Marken und zitierten Quellen</div>
    ${runs.map(chatRow).join('') || '<div class="empty">Keine Läufe.</div>'}</div>`;
}

function pageSources(mode) {
  const runs = runsFor();
  const rows = sourceRows(runs, mode);
  const dist = typeDistribution(runs, mode);
  const days = byDay(runs);
  const isUrl = mode === 'url';

  // Zeitreihe der fünf stärksten Quellen
  const topKeys = rows.slice(0,5).map(r => r.key);
  const series = topKeys.map((key,i) => ({
    name: isUrl ? key.replace(/^https?:\/\//,'').slice(0,34) : key,
    color: PALETTE[i % PALETTE.length],
    x: days.map(d => d[0]),
    y: days.map(([,rs]) => rs.reduce((n,r) =>
      n + r.c.filter(c => (isUrl ? c[C_URL] : c[C_DOM]) === key && (!isUrl || c[C_UKNOWN])).length, 0)),
  }));
  const yMax = Math.max(4, ...series.flatMap(s => s.y));

  const mv = movers(mode, SRC_MOVER).slice(0, 8).map(r => ({
    key:r.key, value:r.retrievals, delta: SRC_MOVER==='top'?null:r.delta,
    label: isUrl
      ? `<b class="t">${esc(r.url.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</b>`
      : `<b class="t">${esc(r.domain)}</b>` }));

  return `
  <h1 class="h">${isUrl ? 'URLs' : 'Domains'}</h1>
  <div class="hsub">Wie oft jede ${isUrl?'URL':'Domain'} in KI-Antworten abgerufen wird</div>
  ${isUrl ? `<div class="note">URL-genaue Zitate liefern nur eigene Scrapes. Die importierten
    Peec-Daten enthalten ausschließlich Domains und erscheinen hier bewusst nicht —
    aktuell ${rows.length} URLs aus ${runs.filter(r=>r.c.some(c=>c[C_UKNOWN])).length} Läufen.</div>` : ''}

  <div class="card"><h3>Abrufe über Zeit</h3>
    <div class="sub">Die fünf stärksten Quellen dieser Auswahl</div>
    ${lineChart(series, { yMax, fmt: v => String(Math.round(v)) })}</div>

  <div class="row r-2-1">
    <div class="card">
      <h3>${isUrl?'URL':'Domain'}-Bewegungen</h3>
      <div class="sub">Gegen den gleich langen Vorzeitraum</div>
      <div class="tabs">${[['top','Top'],['new','Neu'],['up','Steigend'],['down','Fallend']]
        .map(([v,l]) => `<button aria-selected="${SRC_MOVER===v}" onclick="SRC_MOVER='${v}';render()">${l}</button>`).join('')}</div>
      ${hbars(mv, isUrl ? null : 'setDomain')}
    </div>
    <div class="card">
      <h3>${isUrl?'URL':'Quellen'}-Typen</h3><div class="sub">${dist.total} Abrufe</div>
      ${dist.rows.map(r => `<div class="hbar">
        <div class="track" onclick="toggleFacet('${isUrl?'utype':'dtype'}','${r.key}',true)">
          <span style="width:${r.share*100}%;background:color-mix(in srgb, var(--${isUrl?'accent':r.key}) 22%, transparent);
            border-right-color:var(--${isUrl?'accent':r.key})"></span>
          <span class="lbl">${(isUrl?UTYPE_LABEL:DTYPE_LABEL)[r.key]||r.key}</span></div>
        <div class="val">${pct(r.share)}</div></div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>Alle ${isUrl?'URLs':'Domains'}</h3>
    <div class="sub">Jede Quelle, die die KI in dieser Auswahl verwendet hat</div>
    ${tbl([
      { t:'#', r:(r,i)=>`<span class="idx">${i+1}</span>` },
      isUrl
        ? { t:'URL', r:r=>`<a class="link trunc" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title||r.url)}</a>
            <span style="color:var(--muted);font-size:11.5px">${esc(r.domain)}</span>` }
        : { t:'Domain', r:r=>`<span class="link" onclick="setDomain('${esc(r.domain)}')">${esc(r.domain)}</span>
            ${r.known?'':'<span class="pill" style="color:var(--bad);margin-left:6px">neu</span>'}` },
      isUrl ? { t:'Seitentyp', r:r=>typePill('accent', UTYPE_LABEL[r.utype]||r.utype) }
            : { t:'Quellentyp', r:r=>typePill(r.dtype, DTYPE_LABEL[r.dtype]) },
      { t:'LogBATT genannt', r:r=>r.mentionRate>0
          ? `<span class="pill" style="color:var(--good)">${pct(r.mentionRate)}</span>`
          : `<span class="pill" style="color:var(--bad)">nein</span>` },
      { t:'Abrufe', num:true, r:r=>r.retrievals },
      { t:'', r:r=>`<div class="bar" style="width:56px"><span style="width:${r.retrievals/rows[0].retrievals*100}%"></span></div>` },
      { t:'Abrufrate', num:true, r:r=>pct1(r.retrievedRate) },
      { t:'Zitate/Lauf', num:true, r:r=>nm(r.citationRate,1) },
      { t:'Ø Rang', num:true, r:r=>nm(r.avgRank,1) },
      { t:'Prompts', num:true, r:r=>r.promptCount },
    ], rows, { page: 'src-'+mode, empty: isUrl
        ? 'Keine URL-genauen Zitate in dieser Auswahl.' : 'Keine Domains in dieser Auswahl.' })}
  </div>`;
}
let SRC_MOVER = 'top';

function pageGap() {
  const runs = runsFor();
  const rows = gapRows(runs, GAP_MODE);
  const isUrl = GAP_MODE === 'url';
  const ownRows = sourceRows(runs, 'domain').filter(r => r.dtype === 'you');
  const promptGap = [...new Map(runs.map(r => [r.p, null])).keys()].map(id => {
    const rs = runs.filter(r => r.p === id);
    const withOwn = rs.filter(r => r.c.some(c => dtypeOf(c) === 'you')).length;
    const withComp = rs.filter(r => r.c.some(c => dtypeOf(c) === 'competitor')).length;
    return { id, p:PROMPT.get(id), runs:rs.length, withOwn, withComp, ...kpis(rs) };
  }).sort((a,b) => a.withOwn - b.withOwn || b.withComp - a.withComp);

  return `
  <h1 class="h">Gap-Analyse</h1>
  <div class="hsub">Quellen und Prompts, bei denen Wettbewerber vorkommen und LogBATT nicht</div>

  <div class="card">
    <div class="tabs">${[['domain','Domains'],['url','URLs'],['prompt','Prompts']]
      .map(([v,l]) => `<button aria-selected="${GAP_MODE===v}" onclick="GAP_MODE='${v}';render()">${l}</button>`).join('')}</div>
    ${GAP_MODE === 'prompt' ? `
      <div class="sub">Prompts ohne ein einziges Zitat von logbatt.de/.com — oben steht,
        was am meisten kostet: viele Läufe, keine eigene Domain, viele Wettbewerber-Zitate.</div>
      ${tbl([
        { t:'Prompt', r:r=>`<span class="link trunc" onclick="openPrompt(${r.id})">${esc(r.p.text)}</span>` },
        { t:'Thema', r:r=>esc(r.p.cat) },
        { t:'Läufe', num:true, r:r=>r.runs },
        { t:'mit eigener Domain', num:true, r:r=>r.withOwn },
        { t:'Abdeckung', num:true, r:r=>pct(r.withOwn/r.runs) },
        { t:'', r:r=>`<div class="bar" style="width:56px"><span style="width:${r.withOwn/r.runs*100}%"></span></div>` },
        { t:'mit Wettbewerber-Domain', num:true, r:r=>r.withComp },
        { t:'Visibility', num:true, r:r=>pct(r.visibility) },
      ], promptGap)}`
    : `
      <div class="sub">Gap-Score = Abrufe dieser Quelle in Läufen, in denen LogBATT nicht genannt wird.
        Eigene Definition (Peecs Formel ist nicht öffentlich) — bewusst nachrechenbar.</div>
      ${tbl([
        { t:'#', r:(r,i)=>`<span class="idx">${i+1}</span>` },
        { t:'Quelle', r:r=>isUrl
            ? `<a class="link trunc" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>`
            : `<span class="link" onclick="setDomain('${esc(r.domain)}')">${esc(r.domain)}</span>` },
        { t:'Typ', r:r=>typePill(r.dtype, DTYPE_LABEL[r.dtype]) },
        { t:'Abrufe', num:true, r:r=>r.retrievals },
        { t:'Abrufrate', num:true, r:r=>pct1(r.retrievedRate) },
        { t:'Zitate/Lauf', num:true, r:r=>nm(r.citationRate,1) },
        { t:'LogBATT genannt', num:true, r:r=>pct(r.mentionRate) },
        { t:'Gap-Score', num:true, r:r=>`<strong>${r.gap}</strong>` },
        { t:'', r:r=>`<div class="bar" style="width:56px"><span style="width:${r.gap/rows[0].gap*100}%;background:var(--bad)"></span></div>` },
      ], rows, { page: 'gap-'+GAP_MODE, empty: isUrl
          ? 'Keine URL-genauen Zitate in dieser Auswahl.' : 'Kein Gap in dieser Auswahl.' })}`}
  </div>

  ${GAP_MODE !== 'prompt' ? `<div class="card"><h3>Eigene Domains</h3>
    <div class="sub">Wo logbatt.de/.com bereits zitiert wird</div>
    ${tbl([
      { t:'Domain', r:r=>esc(r.domain) },
      { t:'Abrufe', num:true, r:r=>r.retrievals },
      { t:'Abrufrate', num:true, r:r=>pct1(r.retrievedRate) },
      { t:'Prompts', num:true, r:r=>r.promptCount },
      { t:'Ø Rang', num:true, r:r=>nm(r.avgRank,1) },
    ], ownRows, { empty:'Keine eigene Domain in dieser Auswahl zitiert.' })}</div>` : ''}`;
}
let GAP_MODE = 'domain';

function pageInsights() {
  const runs = runsFor();
  const all = brandTable(runs);
  const me = all.find(b => b.own) || {};
  const rank = all.findIndex(b => b.own) + 1;
  const leaders = all.filter(b => !b.own).slice(0, 3).map(b => b.name);
  const k = kpis(runs);
  const pw = prevWindow(), kb = pw ? kpis(runsFor(pw)) : null;

  // Stärkstes / schwächstes Modell nach Visibility
  const perEngine = [...new Set(runs.map(r => r.e))].map(e => ({
    e, ...kpis(runs.filter(r => r.e === e)) })).filter(x => x.visibility != null)
    .sort((a,b) => b.visibility - a.visibility);

  const days = byDay(runs);
  const metricSeries = [{
    name: METRIC === 'visibility' ? 'Visibility' : METRIC === 'sov' ? 'Share of Voice' : 'Ø Position',
    color: 'var(--accent)', x: days.map(d => d[0]),
    y: days.map(([,rs]) => kpis(rs)[METRIC === 'sov' ? 'sov' : METRIC]),
  }];

  // Performance-Matrix: Thema × Modell
  const cats = [...new Set(runs.map(r => PROMPT.get(r.p).cat))];
  const engines = [...new Set(runs.map(r => r.e))];
  const matrix = cats.map(cat => ({
    cat, cells: engines.map(e => kpis(runs.filter(r => r.e === e && PROMPT.get(r.p).cat === cat)).visibility),
  }));

  // Top-Rankings: je Modell die Marken nach Ø Position
  const rankings = engines.map(e => {
    const rs = runs.filter(r => r.e === e);
    return { e, brands: brandTable(rs).slice(0, 8) };
  });

  const heat = v => v == null ? 'var(--line-soft)'
    : `color-mix(in srgb, var(--accent) ${Math.round(v*72)+6}%, transparent)`;

  return `
  <h1 class="h">${rank ? `LogBATT ist #${rank} in der KI-Sichtbarkeit${leaders.length?` — ${esc(leaders.join(', '))} führen`:''}`
      : 'LogBATT kommt in dieser Auswahl nicht vor'}</h1>
  <div class="hsub">${rank === 1 ? 'Erste Wahl in den meisten Antworten.'
    : rank ? 'Sichtbar in vielen Antworten, aber noch nicht die Standardempfehlung.'
    : 'In dieser Auswahl wird die Marke in keiner Antwort genannt.'}</div>

  <div class="kpirow">
    ${[['Visibility', pct1(k.visibility), delta(diff(k.visibility, kb&&kb.visibility))],
       ['Sentiment', k.sentiment==null?'–':nm(k.sentiment,0), delta(diff(k.sentiment, kb&&kb.sentiment), false, v=>nm(v,0))],
       ['Position', k.position==null?'–':'#'+nm(k.position,2), delta(diff(k.position, kb&&kb.position), true, v=>nm(v,2))],
       ['Share of Voice', pct1(k.sov), delta(diff(k.sov, kb&&kb.sov))],
       ['Problem-Narrativ', pct1(k.pn), delta(diff(k.pn, kb&&kb.pn))],
       ['Stärkstes Modell', perEngine.length?ENGINE_LABEL[perEngine[0].e]:'–',
         `<span class="d flat">${perEngine.length?pct(perEngine[0].visibility):''}</span>`],
       ['Schwächstes Modell', perEngine.length?ENGINE_LABEL[perEngine[perEngine.length-1].e]:'–',
         `<span class="d flat">${perEngine.length?pct(perEngine[perEngine.length-1].visibility):''}</span>`]]
      .map(([a,b,c]) => `<div><div class="k">${a}</div><div class="v">${b} ${c||''}</div></div>`).join('')}
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div><h3>Markenentwicklung</h3><div class="sub" style="margin:0">Wie sich die Kennzahl über Zeit verändert</div></div>
      <div class="spacer"></div>
      <div class="seg">${[['visibility','Visibility'],['sov','Share of Voice'],['position','Ø Position']]
        .map(([v,l]) => `<button aria-selected="${METRIC===v}" onclick="METRIC='${v}';render()">${l}</button>`).join('')}</div>
    </div>
    ${lineChart(metricSeries, METRIC === 'position'
      ? { yMax:6, invert:true, fmt:v=>nm(v,1) } : {})}
  </div>

  <div class="card">
    <h3>Performance-Matrix</h3><div class="sub">Visibility je Thema und Modell</div>
    <div class="scroll"><table class="hm"><thead><tr><th>Thema</th>
      ${engines.map(e => `<th class="num">${esc(ENGINE_LABEL[e]||e)}</th>`).join('')}</tr></thead>
      <tbody>${matrix.map(m => `<tr><td>${esc(m.cat)}</td>
        ${m.cells.map(v => `<td style="background:${heat(v)}">${v==null?'–':pct(v)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
  </div>

  <div class="card">
    <h3>Top-Rankings</h3><div class="sub">Führende Marken je Modell, nach Visibility</div>
    <div class="scroll"><table class="hm"><thead><tr><th>Modell</th>
      ${Array.from({length:8},(_,i)=>`<th class="num">#${i+1}</th>`).join('')}</tr></thead>
      <tbody>${rankings.map(r => `<tr><td>${esc(ENGINE_LABEL[r.e]||r.e)}</td>
        ${Array.from({length:8},(_,i) => { const b = r.brands[i];
          return `<td>${b ? `<div class="rank ${b.own?'me':''}" title="${esc(b.name)} · ${pct(b.visibility)}">${esc(b.name)}</div>` : ''}</td>`;
        }).join('')}</tr>`).join('')}</tbody></table></div>
  </div>`;
}
let METRIC = 'visibility';

function pageBrands() {
  const runs = runsFor();
  const rows = brandTable(runs);
  const max = rows[0]?.mentions || 1;

  // "Erstmals" ist bewusst das erste Auftreten INNERHALB der Auswahl, nicht das
  // first_seen_at aus der DB — sonst widerspräche die Spalte dem Filter.
  const firstSeen = { brand:new Map(), domain:new Map() };
  for (const r of runs) {
    for (const b of r.b) if (!firstSeen.brand.has(b[0])) firstSeen.brand.set(b[0], r.d);
    for (const c of r.c) if (!firstSeen.domain.has(c[C_DOM])) firstSeen.domain.set(c[C_DOM], r.d);
  }
  const newDomains = sourceRows(runs, 'domain')
    .filter(r => !r.known)
    .map(r => ({ ...r, first: firstSeen.domain.get(r.domain) || '–' }));
  return `
  <h1 class="h">Wettbewerber</h1>
  <div class="hsub">Alle Marken, die in dieser Auswahl genannt werden</div>
  <div class="card">${tbl([
    { t:'#', r:(r,i)=>`<span class="idx">${i+1}</span>` },
    { t:'Marke', r:r=>`<span class="dot" style="background:${r.own?'var(--accent)':brandColor(r.id)}"></span>
        <span class="link" onclick="setBrand(${r.id})">${esc(r.name)}</span>${r.own?' ★':''}
        ${r.known?'':'<span class="pill" style="color:var(--bad);margin-left:6px">neu</span>'}
        ${!r.comp&&!r.own?'<span class="pill" style="color:var(--muted);margin-left:6px">Partner</span>':''}` },
    { t:'Visibility', num:true, r:r=>pct(r.visibility) },
    { t:'', r:r=>`<div class="bar" style="width:70px"><span style="width:${r.mentions/max*100}%"></span></div>` },
    { t:'Share of Voice', num:true, r:r=>pct1(r.sov) },
    { t:'Ø Position', num:true, r:r=>'#'+nm(r.position,2) },
    { t:'Nennungen', num:true, r:r=>r.mentions },
    { t:'Läufe', num:true, r:r=>r.runCount },
  ], rows)}</div>

  <div class="row r-1-1">
    <div class="card">
      <h3>Neu entdeckte Marken</h3>
      <div class="sub">Von der Auswertung gefunden, nicht vorher gepflegt (is_known = 0)</div>
      ${tbl([
        { t:'Marke', r:r=>`<span class="dot" style="background:${brandColor(r.id)}"></span>
            <span class="link" onclick="setBrand(${r.id})">${esc(r.name)}</span>` },
        { t:'Erstmals', r:r=>esc(r.first) },
        { t:'Nennungen', num:true, r:r=>r.mentions },
        { t:'Visibility', num:true, r:r=>pct(r.visibility) },
      ], rows.filter(r => !r.known).map(r => ({ ...r, first: firstSeen.brand.get(r.id) || '–' })),
        { page:'disc-brands', empty:'Keine neuen Marken in dieser Auswahl.' })}
    </div>
    <div class="card">
      <h3>Neu entdeckte Domains</h3>
      <div class="sub">Erstmals zitierte Quellen, die noch keiner Marke zugeordnet sind</div>
      ${tbl([
        { t:'Domain', r:r=>`<span class="link" onclick="setDomain('${esc(r.domain)}')">${esc(r.domain)}</span>` },
        { t:'Typ', r:r=>typePill(r.dtype, DTYPE_LABEL[r.dtype]) },
        { t:'Erstmals', r:r=>esc(r.first) },
        { t:'Abrufe', num:true, r:r=>r.retrievals },
      ], newDomains, { page:'disc-domains', empty:'Keine neuen Domains in dieser Auswahl.' })}
    </div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Einstellungen — API-Schlüssel. Zwei Modi, automatisch erkannt:
//   • Server-Modus (`geotracker serve`): Schlüssel wandern in die .env.
//   • Lokaler Modus (Datei/Export): Schlüssel werden im Browser (localStorage)
//     gespeichert — bewusst, weil das Tool lokal läuft. Sie verlassen den
//     Rechner nie und landen nicht im HTML.
let SETTINGS_MODE = 'checking';   // 'server' | 'local'

function maskLocal(v) { v = (v||'').trim(); return !v ? '' : (v.length>=4 ? '····'+v.slice(-4) : '····'); }
function localSettingsStatus() {
  const sa = lsGet(STORE.key('searchapi')) || '';
  const an = lsGet(STORE.key('anthropic')) || '';
  return { local:true, keys:{
    searchapi:{ configured:!!sa, hint:maskLocal(sa) },
    anthropic:{ configured:!!an, hint:maskLocal(an) } } };
}

function pageSettings() {
  setTimeout(hydrateSettings, 0);
  return `
  <h1 class="h">Einstellungen</h1>
  <div class="hsub">API-Schlüssel für die Datenerfassung. Die Anzeige zeigt nur die
    letzten vier Zeichen zur Wiedererkennung — der vollständige Schlüssel wird nie
    zurückgegeben.</div>
  <div id="settingsBody"><div class="empty">Prüfe Umgebung…</div></div>`;
}

async function hydrateSettings() {
  const body = document.getElementById('settingsBody');
  if (!body) return;
  let st;
  try {
    const res = await fetch('api/settings', { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    st = await res.json();
    SETTINGS_MODE = 'server';
  } catch (e) {
    SETTINGS_MODE = 'local';
    st = localSettingsStatus();
  }
  body.innerHTML = settingsForm(st);
}

function settingsForm(st) {
  const k = st.keys;
  const modeNote = SETTINGS_MODE === 'server'
    ? `<div class="hsub" style="margin-top:14px">Server-Modus: gespeichert in
        <code>${esc(st.env_path)}</code>. Neue Läufe (<code>geotracker ingest</code> /
        <code>evaluate</code>) verwenden den Wert ab dem nächsten Aufruf.</div>`
    : `<div class="hsub" style="margin-top:14px">Lokaler Modus: die Schlüssel liegen nur in
        <b>diesem Browser</b> (localStorage) und verlassen den Rechner nicht. Für echte
        Abrufe startest du das Tool mit <code>python3 -m geotracker serve</code> — dann
        landen sie in der <code>.env</code>.</div>`;
  return `
  ${settingsKey('sa', 'SearchApi-Schlüssel', k.searchapi,
    'Ebene 1 — Scraping der KI-Oberflächen (ChatGPT, Perplexity, Gemini, Google AI Overview). Ohne diesen Schlüssel laufen keine neuen Abrufe.')}
  ${settingsKey('an', 'Anthropic-Schlüssel', k.anthropic,
    'Ebene 2 — Auswertung mit Claude Haiku 4.5 (Sentiment, Problem-Narrativ). Für reine Ebene-1-Abrufe nicht nötig.')}

    <span id="setFeedback" style="font-size:12.5px;color:var(--ink-2)"></span>
  </div>
  ${modeNote}`;
}

function settingsKey(id, label, meta, help) {
  const status = meta.configured
    ? `<span style="font-size:11.5px;font-weight:600;color:var(--pos);
         background:var(--accent-soft);padding:2px 8px;border-radius:20px">gesetzt · ${esc(meta.hint)}</span>`
    : `<span style="font-size:11.5px;font-weight:600;color:var(--neg);
         background:rgba(190,40,40,.09);padding:2px 8px;border-radius:20px">fehlt</span>`;
  return `<div class="card">
    <h3 style="display:flex;align-items:center;gap:10px">${esc(label)} ${status}</h3>
    <div class="sub">${help}</div>
    <input id="set_${id}" type="password" autocomplete="off" spellcheck="false"
      placeholder="${meta.configured ? 'Neuen Schlüssel eingeben, um zu ersetzen' : 'Schlüssel hier einfügen'}"
      style="width:100%;box-sizing:border-box;margin-top:11px;padding:9px 11px;
        border:1px solid var(--line);border-radius:8px;font:inherit;
        background:var(--bg);color:var(--ink)">
  </div>`;
}

window.saveSettings = async () => {
  const fb = document.getElementById('setFeedback');
  const sa = (document.getElementById('set_sa') || {}).value?.trim() || '';
  const an = (document.getElementById('set_an') || {}).value?.trim() || '';
  if (!sa && !an) { fb.textContent = 'Kein neuer Schlüssel eingegeben.'; return; }

  if (SETTINGS_MODE === 'local') {
    if (sa) lsSet(STORE.key('searchapi'), sa);
    if (an) lsSet(STORE.key('anthropic'), an);
    document.getElementById('settingsBody').innerHTML = settingsForm(localSettingsStatus());
    document.getElementById('setFeedback').textContent = 'Lokal in diesem Browser gespeichert.';
    return;
  }
  const payload = {};
  if (sa) payload.searchapi = sa;
  if (an) payload.anthropic = an;
  fb.textContent = 'Speichere…';
  try {
    const res = await fetch('api/settings', { method:'POST',
      headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('settingsBody').innerHTML = settingsForm(await res.json());
    document.getElementById('setFeedback').textContent =
      'Gespeichert. Neue Läufe verwenden die Schlüssel ab sofort.';
  } catch (e) {
    fb.textContent = 'Fehler beim Speichern: ' + e.message;
  }
};

// ===========================================================================
// Projekte — jedes Projekt ist ein eigener Datensatz (gleiche Form wie der
// eingebettete). Umschalten lädt die Seite mit dem gewählten Datensatz neu,
// sodass die komplette Auswertung unverändert weiterläuft.
// ===========================================================================
function projectRegistry() {
  try { return JSON.parse(lsGet(STORE.reg) || '{}'); } catch (e) { return {}; }
}
function builtinName() {
  const own = (EMBEDDED.brands || []).find(b => b.own);
  return (own && own.name) || 'Eingebautes Projekt';
}
function projectList() {
  const reg = projectRegistry();
  const active = lsGet(STORE.active) || STORE.builtin;
  const rows = [{ id:STORE.builtin, name:builtinName()+' (eingebaut)', builtin:true }];
  for (const id of Object.keys(reg)) rows.push({ id, name:reg[id].name, builtin:false });
  for (const r of rows) r.active = r.id === active;
  if (!rows.some(r => r.active)) rows[0].active = true;
  return rows;
}
window.switchProject = id => {
  if (id === STORE.builtin) lsDel(STORE.active); else lsSet(STORE.active, id);
  location.hash = 'overview'; location.reload();
};
function createProject(name, data) {
  const id = 'p' + Date.now().toString(36);
  const reg = projectRegistry();
  reg[id] = { name, createdAt: new Date().toISOString() };
  if (!lsSet(STORE.proj(id), JSON.stringify(data)) || !lsSet(STORE.reg, JSON.stringify(reg)))
    return null;
  return id;
}
window.deleteProject = id => {
  const reg = projectRegistry();
  if (!reg[id]) return;
  if (!confirm(`Projekt „${reg[id].name}" wirklich löschen?`)) return;
  delete reg[id]; lsSet(STORE.reg, JSON.stringify(reg)); lsDel(STORE.proj(id));
  if ((lsGet(STORE.active) || '') === id) lsDel(STORE.active);
  location.hash = 'projects'; location.reload();
};

// ---------------------------------------------------------------------------
// Deterministischer Demo-Datensatz (gesät, damit er stabil bleibt). Erzeugt
// echte Streuung: viele Läufe über Zeit, Domains/URLs mit unterschiedlicher
// Abruf-Häufigkeit — genau das, was ein einzelner Fixture-Lauf nicht zeigt.
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function demoPayload(opts) {
  opts = opts || {};
  const rnd = mulberry32(0xC0FFEE ^ ((opts.seed||'demo').split('').reduce((a,c)=>a+c.charCodeAt(0),0)));
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const slug = s => (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,24) || 'marke';

  const ownName = (opts.ownName || 'Demo GmbH').trim();
  const ownDomain = slug(opts.ownDomain || ownName) + '.de';
  const competitors = (opts.competitors && opts.competitors.length ? opts.competitors
    : ['Wettbewerb Nord','Wettbewerb Süd','Wettbewerb West']).map(s=>s.trim()).filter(Boolean);
  const promptTexts = (opts.prompts && opts.prompts.length ? opts.prompts : [
    'Wer bietet die beste Lösung für ' + ownName.split(' ')[0] + '?',
    'Welche Anbieter gibt es für sichere Lagerung?',
    'Vergleich der führenden Anbieter in der Branche',
    'Worauf bei der Auswahl eines Dienstleisters achten?',
    'Empfehlungen für zertifizierte Anbieter',
    'Welche Firma hat die beste Beratung?',
  ]).map(s=>s.trim()).filter(Boolean);

  // Marken: eigene + Wettbewerber + zwei „earned media"/Referenzen.
  const brands = [{ id:1, name:ownName, own:1, comp:0, known:1, seen:null }];
  competitors.forEach((c,i)=> brands.push({ id:2+i, name:c, own:0, comp:1, known:1, seen:null }));
  const refBase = brands.length + 1;
  const refs = ['Branchenportal', 'Fachmagazin'];
  refs.forEach((c,i)=> brands.push({ id:refBase+i, name:c, own:0, comp:0, known:1, seen:null }));

  // Domains + je ein paar echte URLs (damit die URL-Sektion Häufigkeiten zeigt).
  const domains = {};
  const urlPool = [];
  const addDomain = (host, stype, dtype) => {
    domains[host] = { type:stype, dtype, known:1, seen:null };
    const paths = ['/', '/loesungen/', '/produkte/lager/', '/ratgeber/sicherheit/', '/referenzen/'];
    paths.forEach(p => urlPool.push({
      url:'https://www.'+host+p, domain:host, stype,
      utype: p==='/'?'homepage':(p.includes('produkte')?'product_page':(p.includes('ratgeber')?'how_to':'category_page')),
      title: (stype==='owned'?ownName:host)+' – '+(p==='/'?'Startseite':p.replace(/\//g,' ').trim()),
      known:1 }));
  };
  addDomain(ownDomain, 'owned', 'you');
  competitors.forEach(c => addDomain(slug(c)+'.de', 'competitor', 'competitor'));
  addDomain('branchenportal.de', 'earned_media', 'reference');
  addDomain('fachmagazin.de', 'earned_media', 'editorial');
  addDomain('wikipedia.org', 'other', 'reference');

  const engines = ['chatgpt','perplexity','gemini','google_ai_overview'];
  const today = new Date();
  const runs = [];
  let rid = 1;
  const days = 30;
  for (let d = days; d >= 0; d -= 1) {
    const date = new Date(today.getTime() - d*86400000).toISOString().slice(0,10);
    promptTexts.forEach((_, pi) => engines.forEach(eng => {
      if (rnd() < 0.35) return;                       // nicht jeder Prompt jeden Tag/Engine
      const mentioned = rnd() < 0.55 ? 1 : 0;
      const pos = mentioned ? 1 + Math.floor(rnd()*4) : null;
      const sent = mentioned ? +(0.1 + rnd()*0.8).toFixed(2) : null;
      // 3–6 zitierte Quellen, nach Rang. Eigene erscheint, wenn mentioned.
      const n = 3 + Math.floor(rnd()*4);
      const chosen = [];
      const seen = new Set();
      for (let r = 0; r < n; r += 1) {
        const src = pick(urlPool);
        if (seen.has(src.url)) continue; seen.add(src.url);
        chosen.push(src);
      }
      // [dom,url,stype,url_known,rank,title,is_known,url_type]
      const c = chosen.map((s, i) => [s.domain, s.url, s.stype, 1, i+1, s.title, 1, s.utype]);
      // Markennennungen (b): eigene + ein paar Wettbewerber.
      const b = [];
      if (mentioned) b.push([1, pos]);
      brands.filter(x=>x.comp).forEach((x,i)=>{ if (rnd()<0.4) b.push([x.id, i+1+(mentioned?1:0)]); });
      runs.push({ id:rid++, p:pi+1, e:eng, d:date, s:'demo',
        m:mentioned, pos, sen:sent, pn: mentioned && rnd()<0.5 ? 1 : 0,
        ev:'demo-1', t:'(Demo-Antwort — synthetische Daten zur Veranschaulichung.)',
        c, b });
    }));
  }

  const prompts = promptTexts.map((text, i) => ({
    id:i+1, text, cat:'Demo', country:'DE', lang:'de',
    branding:'unbranded', intent:'commercial', tags:['demo'] }));

  return {
    generated_at: new Date().toISOString().replace(/\.\d+Z$/,'Z'),
    prompts, brands, domains, runs,
    meta:{ skipped_runs:0, sources:['demo'], engines, demo:true },
  };
}

// Beim ersten Start ein Demo-Projekt hinterlegen, damit sofort etwas zu sehen
// ist (idempotent — nur einmal, danach vom Nutzer frei löschbar).
function ensureDemoSeed() {
  if (lsGet(STORE.seeded)) return;
  const id = createProject('Demo GmbH (Beispieldaten)', demoPayload({ seed:'demo' }));
  if (id) lsSet(STORE.seeded, '1');
}

window.submitNewProject = () => {
  const val = id => (document.getElementById('np_'+id)||{}).value?.trim() || '';
  const name = val('name') || val('own') || 'Neues Projekt';
  const own = val('own') || name;
  const competitors = val('comp').split(',').map(s=>s.trim()).filter(Boolean);
  const prompts = val('prompts').split('\n').map(s=>s.trim()).filter(Boolean);
  const withDemo = document.getElementById('np_demo').checked;
  const fb = document.getElementById('npFeedback');

  const data = withDemo
    ? demoPayload({ seed:name, ownName:own, ownDomain:val('domain'), competitors, prompts })
    : { generated_at:new Date().toISOString().replace(/\.\d+Z$/,'Z'),
        prompts: prompts.map((text,i)=>({ id:i+1, text, cat:'Eigene', country:'DE', lang:'de',
          branding:'unbranded', intent:'commercial', tags:[] })),
        brands: [{ id:1, name:own, own:1, comp:0, known:1, seen:null },
          ...competitors.map((c,i)=>({ id:2+i, name:c, own:0, comp:1, known:1, seen:null }))],
        domains:{}, runs:[], meta:{ skipped_runs:0, sources:[], engines:[] } };

  const id = createProject(name, data);
  if (!id) { fb.textContent = 'Speichern fehlgeschlagen (localStorage nicht verfügbar?).'; return; }
  switchProject(id);
};

  intro:   { title:'Über das Tool', view:pageIntro },
  overview:{ title:'Overview', view:pageOverview },
  prompts: { title:'Prompts', view:pagePrompts },
  domains: { title:'Quellen › Domains', view:()=>pageSources('domain') },
  urls:    { title:'Quellen › URLs', view:()=>pageSources('url') },
  gap:     { title:'Quellen › Gap-Analyse', view:pageGap },
  insights:{ title:'Marke › Insights', view:pageInsights },
  brands:  { title:'Marke › Wettbewerber', view:pageBrands },
  projects:{ title:'System › Projekte', view:pageProjects },
  newproject:{ title:'System › Neues Projekt', view:pageNewProject },
  settings:{ title:'System › Einstellungen', view:pageSettings },
};

// Routing über den Hash: die Seite ist damit verlinkbar und der Zurück-Knopf
// des Browsers funktioniert — auch als lokale Datei ohne Server.
window.go = r => { if (location.hash.slice(1) !== r) location.hash = r;
                   ROUTE = r; DETAIL = null; render(); };
window.addEventListener('hashchange', () => {
  const r = location.hash.slice(1);
  if (PAGES[r] && r !== ROUTE) { ROUTE = r; DETAIL = null; render(); }
});
window.openPrompt = id => { DETAIL = id; ROUTE = 'prompts'; render(); };
window.setDomain = d => { F.domain = [d]; DETAIL = null; renderChips(); render(); };
window.setBrand = id => { F.brand = [id]; DETAIL = null; renderChips(); render(); };
window.onlyCategory = c => { F.category = F.category.length===1 && F.category[0]===c ? [] : [c];
  DETAIL = null; renderChips(); render(); };

function render() {
  document.querySelectorAll('aside a[data-route]').forEach(a =>
    a.setAttribute('aria-current', a.dataset.route === ROUTE ? 'page' : 'false'));
  const parts = PAGES[ROUTE].title.split('›');
  document.getElementById('crumb').innerHTML = parts.map((p,i) =>
    `${i ? '<span class="sep">›</span>' : ''}<span>${esc(p.trim())}</span>`).join('');
  try { document.getElementById('page').innerHTML = PAGES[ROUTE].view(); }
  catch (err) { document.getElementById('page').innerHTML =
    `<div class="empty">Fehler beim Rendern: ${esc(err.message)}</div>`; console.error(err); }
}

function renderProjectPicker() {
  const rows = projectList();
  const opts = rows.map(r =>
    `<option value="${esc(r.id)}" ${r.active?'selected':''}>${esc(r.name)}</option>`).join('');
  document.getElementById('projectpick').innerHTML =
    `<select id="projSelect" onchange="switchProject(this.value)"
       title="Projekt wechseln">${opts}</select>`;
}

(function init() {
  ensureDemoSeed();
  renderProjectPicker();
  F.since = SPAN.min; F.until = SPAN.max;
  document.querySelectorAll('aside a[data-route]').forEach(a => {
    a.href = '#' + a.dataset.route;
    a.onclick = e => { e.preventDefault(); go(a.dataset.route); };
  });
  ROUTE = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'intro';
  const demo = D.meta && D.meta.demo;
  document.getElementById('sidefoot').innerHTML =
    `${demo ? '<b>Demo-Daten</b><br>' : 'Schnappschuss<br>'}${esc((D.generated_at||'').slice(0,10))}<br>
     ${D.runs.length} Läufe · ${D.prompts.length} Prompts<br>
     <span style="opacity:.8">Rechnet lokal im Browser</span>`;
  renderChips();
  render();
})();
</script>
