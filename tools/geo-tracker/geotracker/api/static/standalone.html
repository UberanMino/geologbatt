<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO-Visibility-Tracker · LogBATT</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --ink:#16191d; --muted:#6b7280;
  --own:#0f766e; --comp:#b45309; --earned:#4f46e5; --other:#94a3b8;
  --good:#0f766e; --bad:#b91c1c; --accent:#0f766e;
  --on-accent:#fff; --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0f1216; --panel:#171b21; --line:#272d36; --ink:#e6e9ee;
    --muted:#98a2b3; --own:#2dd4bf; --comp:#fbbf24; --earned:#a5b4fc; --other:#64748b;
    --good:#2dd4bf; --bad:#f87171; --accent:#2dd4bf; --on-accent:#08110f; }
}
:root[data-theme="dark"]{ --bg:#0f1216; --panel:#171b21; --line:#272d36; --ink:#e6e9ee;
  --muted:#98a2b3; --own:#2dd4bf; --comp:#fbbf24; --earned:#a5b4fc; --other:#64748b;
  --good:#2dd4bf; --bad:#f87171; --accent:#2dd4bf; --on-accent:#08110f; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
main{padding:16px 20px 60px;max-width:1500px;margin:0 auto}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:16px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);margin-bottom:4px;font-weight:600}
select,input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
select[multiple]{height:88px}
.filter-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
button{padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
  color:var(--ink);font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button:hover{filter:brightness(1.06)}
:is(button,select,input,summary,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;
  padding:9px 13px;color:var(--muted);font-weight:550}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.card .v{font-size:25px;font-weight:660;letter-spacing:-.02em;margin-top:3px}
.card .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:16px;overflow:hidden}
.panel h2{font-size:13px;margin:0 0 10px;font-weight:650;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid currentColor}
.t-owned{color:var(--own)} .t-competitor{color:var(--comp)}
.t-earned_media{color:var(--earned)} .t-other{color:var(--other)}
.new{color:var(--bad);font-weight:700;font-size:11px}
.bar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);
  overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--accent)}
a{color:var(--accent)}
.clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
details{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:9px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}
pre.answer{white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px;
  max-height:380px;overflow:auto;margin:9px 0}
.empty{color:var(--muted);padding:22px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.note{background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 13px;margin-bottom:16px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>GEO-Visibility-Tracker</h1>
  <span class="sub" id="status"></span>
</header>

<main>
  <div class="note" id="snapshot"></div>
  <section class="filters" id="filters"></section>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</main>

<script>
// ===========================================================================
// Eingebetteter Datenstand. Wird von `geotracker export-html` ersetzt.
// Diese Datei rechnet alles im Browser — kein Server, keine Netzwerkaufrufe.
// ===========================================================================
const D = /*__GEO_DATA__*/null;

const PROMPT = new Map(D.prompts.map(p => [p.id, p]));
const BRAND  = new Map(D.brands.map(b => [b.id, b]));
const OWN_ID = (D.brands.find(b => b.own) || {}).id;

const F = { since:null, until:null, engine:[], country:[], language:[], category:[],
            source:[], brand_id:[], domain:[], prompt_id:[], url:null };
let TAB = 'overview', DETAIL_PROMPT = null;

// --- Filter (dieselbe Semantik wie im Backend: Facetten UND, innerhalb ODER)
function filtered(extra) {
  const f = Object.assign({}, F, extra || {});
  return D.runs.filter(r => {
    const p = PROMPT.get(r.p);
    if (f.since && r.d < f.since) return false;
    if (f.until && r.d > f.until) return false;
    if (f.engine.length   && !f.engine.includes(r.e)) return false;
    if (f.source.length   && !f.source.includes(r.s)) return false;
    if (f.country.length  && !f.country.includes(p.country)) return false;
    if (f.language.length && !f.language.includes(p.lang)) return false;
    if (f.category.length && !f.category.includes(p.cat)) return false;
    if (f.prompt_id.length && !f.prompt_id.includes(r.p)) return false;
    if (f.domain.length   && !r.c.some(c => f.domain.includes(c[0]))) return false;
    if (f.url             && !r.c.some(c => c[3] && c[1] === f.url)) return false;
    if (f.brand_id.length && !r.b.some(b => f.brand_id.includes(b[0]))) return false;
    return true;
  });
}

// --- Kennzahlen ------------------------------------------------------------
function kpis(runs) {
  const evaluated = runs.filter(r => r.m !== null);
  const mentioned = evaluated.filter(r => r.m === 1);
  const positions = mentioned.map(r => r.pos).filter(v => v != null);

  let ownMentions = 0, allMentions = 0;
  const cit = { total:0, owned:0, competitor:0, earned_media:0, other:0 };
  const domains = new Set();
  for (const r of runs) {
    for (const b of r.b) { allMentions++; if (b[0] === OWN_ID) ownMentions++; }
    for (const c of r.c) { cit.total++; cit[c[2]]++; domains.add(c[0]); }
  }
  const sentiment = { positive:0, neutral:0, negative:0 };
  for (const r of evaluated) if (r.sen) sentiment[r.sen]++;

  return {
    runs: runs.length,
    evaluated: evaluated.length,
    // Nenner ist die Zahl der AUSGEWERTETEN Läufe: ein unbewerteter Lauf ist
    // kein "LogBATT kam nicht vor".
    visibility: evaluated.length ? mentioned.length / evaluated.length : null,
    avg_position: positions.length ? positions.reduce((a,b)=>a+b,0)/positions.length : null,
    share_of_voice: allMentions ? ownMentions / allMentions : null,
    problem_narrative_rate: evaluated.length
      ? evaluated.filter(r => r.pn === 1).length / evaluated.length : null,
    sentiment,
    citations: Object.assign({ domains: domains.size }, cit),
  };
}

function previousPeriod() {
  if (!F.since || !F.until) return null;
  const day = 86400000, a = new Date(F.since), b = new Date(F.until);
  const len = Math.round((b - a) / day) + 1;
  const pe = new Date(a - day), ps = new Date(pe - (len - 1) * day);
  const iso = d => d.toISOString().slice(0, 10);
  return { since: iso(ps), until: iso(pe) };
}

function timeseries(runs) {
  const byDay = new Map();
  for (const r of runs) {
    if (!byDay.has(r.d)) byDay.set(r.d, []);
    byDay.get(r.d).push(r);
  }
  return [...byDay.keys()].sort().map(day => {
    const k = kpis(byDay.get(day));
    return { day, runs: k.runs, visibility: k.visibility,
             avg_position: k.avg_position, sov: k.share_of_voice };
  });
}

function groupBy(runs, keyFn) {
  const groups = new Map();
  for (const r of runs) {
    const key = keyFn(r);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  return [...groups.entries()].map(([label, rs]) => {
    const k = kpis(rs);
    return { label, runs: k.runs, visibility: k.visibility, avg_position: k.avg_position,
             anchored: rs.filter(r => r.pn === 1).length, _runs: rs };
  }).sort((a, b) => b.runs - a.runs);
}

function domainRanking(runs, type) {
  const map = new Map();
  for (const r of runs) for (const c of r.c) {
    if (type && c[2] !== type) continue;
    if (!map.has(c[0])) map.set(c[0], { domain:c[0], source_type:c[2], is_known:c[6],
                                        citations:0, runs:new Set(), prompts:new Set(), rank:0 });
    const e = map.get(c[0]);
    e.citations++; e.runs.add(r.id); e.prompts.add(r.p); e.rank += c[4];
  }
  return [...map.values()].map(e => ({
    domain:e.domain, source_type:e.source_type, is_known:e.is_known, citations:e.citations,
    runs:e.runs.size, prompts:e.prompts.size, avg_rank:e.rank/e.citations,
  })).sort((a,b) => b.citations - a.citations || a.domain.localeCompare(b.domain));
}

function urlRanking(runs) {
  const map = new Map();
  for (const r of runs) for (const c of r.c) {
    if (!c[3]) continue;                       // nur URL-genaue Zitate
    if (!map.has(c[1])) map.set(c[1], { url:c[1], domain:c[0], source_type:c[2],
                                        title:c[5], citations:0, prompts:new Set(), rank:0 });
    const e = map.get(c[1]);
    e.citations++; e.prompts.add(r.p); e.rank += c[4];
  }
  return [...map.values()].map(e => ({ ...e, prompts:e.prompts.size, avg_rank:e.rank/e.citations }))
    .sort((a,b) => b.citations - a.citations);
}

function brandLeaderboard(runs) {
  const map = new Map();
  let total = 0;
  const evaluated = runs.filter(r => r.m !== null).length;
  for (const r of runs) for (const b of r.b) {
    total++;
    if (!map.has(b[0])) map.set(b[0], { brand_id:b[0], mentions:0, runs:new Set(), rank:0 });
    const e = map.get(b[0]);
    e.mentions++; e.runs.add(r.id); e.rank += b[1];
  }
  return [...map.values()].map(e => {
    const b = BRAND.get(e.brand_id) || { name:'?' };
    return { ...b, brand_id:e.brand_id, mentions:e.mentions, runs:e.runs.size,
             avg_position:e.rank/e.mentions,
             share_of_voice: total ? e.mentions/total : null,
             visibility: evaluated ? e.runs.size/evaluated : null };
  }).sort((a,b) => b.mentions - a.mentions);
}

function promptTable(runs) {
  return groupBy(runs, r => r.p).map(g => {
    const p = PROMPT.get(g.label);
    return { prompt_id:g.label, prompt:p.text, category:p.cat, country:p.country,
             runs:g.runs, visibility:g.visibility, avg_position:g.avg_position,
             anchored:g.anchored, last_run: g._runs.map(r=>r.d).sort().pop() };
  }).sort((a,b) => (b.visibility ?? -1) - (a.visibility ?? -1) || b.runs - a.runs);
}

function gapView(runs) {
  return groupBy(runs, r => r.p).map(g => {
    const p = PROMPT.get(g.label);
    const withOwned = g._runs.filter(r => r.c.some(c => c[2] === 'owned')).length;
    const withComp  = g._runs.filter(r => r.c.some(c => c[2] === 'competitor')).length;
    const ownedCit  = g._runs.reduce((n,r) => n + r.c.filter(c => c[2]==='owned').length, 0);
    return { prompt_id:g.label, prompt:p.text, category:p.cat, runs:g.runs,
             visibility:g.visibility, runs_with_owned:withOwned,
             runs_with_competitor:withComp, owned_citations:ownedCit };
  }).sort((a,b) => a.runs_with_owned - b.runs_with_owned || b.runs - a.runs);
}

function discoveries(runs) {
  const first = new Map();
  for (const r of runs) for (const c of r.c) {
    if (c[6]) continue;                        // bereits bekannte Domain
    const e = first.get(c[0]);
    if (!e) first.set(c[0], { domain:c[0], source_type:c[2], first_run_date:r.d, citations:1 });
    else { e.citations++; if (r.d < e.first_run_date) e.first_run_date = r.d; }
  }
  return {
    domains: [...first.values()].sort((a,b) =>
      b.first_run_date.localeCompare(a.first_run_date) || b.citations - a.citations),
    brands: D.brands.filter(b => !b.known),
  };
}

// --- Formatierung ----------------------------------------------------------
const pct  = v => v == null ? '–' : (v*100).toFixed(0) + '%';
const pct1 = v => v == null ? '–' : (v*100).toFixed(1) + '%';
const num  = (v,d=2) => v == null ? '–' : Number(v).toFixed(d);
const esc  = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag  = t => `<span class="tag t-${t}">${t.replace('_',' ')}</span>`;
const bar  = v => `<div class="bar"><span style="width:${Math.max(0,Math.min(1,v||0))*100}%"></span></div>`;
const delta = (d, invert=false, fmt=pct1) => {
  if (d == null || Math.abs(d) < 1e-9) return '<span class="d">±0</span>';
  const better = invert ? d < 0 : d > 0;
  return `<span class="d ${better?'up':'down'}">${d>0?'+':''}${fmt(d)} ggü. Vorzeitraum</span>`;
};

function table(columns, rows, { empty='Keine Daten in dieser Auswahl.' } = {}) {
  if (!rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="scroll"><table><thead><tr>${
    columns.map(c => `<th class="${c.num?'num':''}">${esc(c.title)}</th>`).join('')
  }</tr></thead><tbody>${
    rows.map(r => `<tr>${columns.map(c => `<td class="${c.num?'num':''}">${c.render(r)}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}

function lineChart(series, { height=190, yMax=1, invert=false, fmt=pct } = {}) {
  if (!series[0] || series[0].values.length < 2)
    return '<div class="empty">Zu wenige Datenpunkte für eine Zeitreihe.</div>';
  const W=900, H=height, pad={l:46,r:12,t:12,b:26}, n=series[0].values.length;
  const x = i => pad.l + (i*(W-pad.l-pad.r))/Math.max(1,n-1);
  const y = v => { const t = Math.max(0,Math.min(1,v/yMax));
                   return pad.t + (invert?t:1-t)*(H-pad.t-pad.b); };
  const path = vals => vals.map((v,i) =>
      v==null ? null : `${i && vals[i-1]!=null ? 'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`)
    .filter(Boolean).join(' ');
  const ticks = [0,.25,.5,.75,1].map(t => { const v=t*yMax; return `
    <line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".12"/>
    <text x="${pad.l-7}" y="${y(v)+4}" text-anchor="end" font-size="10" opacity=".55">${fmt(v)}</text>`;
  }).join('');
  const labels = series[0].labels.map((l,i) =>
    (i % Math.ceil(n/8) === 0 || i === n-1)
      ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" opacity=".55">${esc(l.slice(5))}</text>` : ''
  ).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;color:var(--ink)">
    ${ticks}${labels}
    ${series.map(s => `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>` +
      s.values.map((v,i)=> v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}">
        <title>${esc(s.labels[i])}: ${fmt(v)}</title></circle>`).join('')).join('')}
  </svg>
  <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

// --- Ansichten -------------------------------------------------------------
const TABS = { overview:'Übersicht', prompts:'Prompts', domains:'Domains', urls:'URLs',
               gaps:'Eigen-Domain-Gap', earned:'Earned Media', brands:'Marken',
               breakdown:'Kategorie / Land / Engine', discovered:'Neu entdeckt' };

function viewOverview() {
  const runs = filtered(), c = kpis(runs), ts = timeseries(runs);
  const prev = previousPeriod();
  const before = prev ? kpis(filtered(prev)) : null;
  const dlt = k => before && c[k] != null && before[k] != null ? c[k] - before[k] : null;
  const ci = c.citations, s = c.sentiment, sentTotal = s.positive + s.neutral + s.negative;
  const kpi = (k,v,d) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${d||'<div class="d">&nbsp;</div>'}</div>`;

  return `
  <div class="kpis">
    ${kpi('Läufe', c.runs, `<div class="d">${c.evaluated} ausgewertet</div>`)}
    ${kpi('Visibility', pct1(c.visibility), delta(dlt('visibility')))}
    ${kpi('Share of Voice', pct1(c.share_of_voice), delta(dlt('share_of_voice')))}
    ${kpi('Ø Position', num(c.avg_position), delta(dlt('avg_position'), true, v=>num(v)))}
    ${kpi('Problem-Narrativ', pct1(c.problem_narrative_rate), delta(dlt('problem_narrative_rate')))}
    ${kpi('Zitate', ci.total, `<div class="d">${ci.domains} verschiedene Domains</div>`)}
    ${kpi('Eigene Zitate', ci.owned, `<div class="d">${ci.total?pct1(ci.owned/ci.total):'–'} aller Zitate</div>`)}
    ${kpi('Earned Media', ci.earned_media, `<div class="d">${ci.total?pct1(ci.earned_media/ci.total):'–'} aller Zitate</div>`)}
  </div>
  <div class="panel"><h2>Visibility & Share of Voice über Zeit</h2>
    ${lineChart([
      { name:'Visibility', color:'var(--own)', values:ts.map(r=>r.visibility), labels:ts.map(r=>r.day) },
      { name:'Share of Voice', color:'var(--earned)', values:ts.map(r=>r.sov), labels:ts.map(r=>r.day) },
    ])}
  </div>
  <div class="grid2">
    <div class="panel"><h2>Ø Position über Zeit (kleiner ist besser)</h2>
      ${lineChart([{ name:'Ø Position', color:'var(--comp)',
        values:ts.map(r=>r.avg_position), labels:ts.map(r=>r.day) }],
        { yMax:6, invert:true, fmt:v=>v.toFixed(1) })}</div>
    <div class="panel"><h2>Zitatquellen & Sentiment</h2>
      ${table([
        { title:'Typ', render:r=>tag(r.type) },
        { title:'Zitate', num:true, render:r=>r.n },
        { title:'Anteil', num:true, render:r=>ci.total?pct1(r.n/ci.total):'–' },
        { title:'', render:r=>bar(ci.total?r.n/ci.total:0) },
      ], [{type:'owned',n:ci.owned},{type:'competitor',n:ci.competitor},
          {type:'earned_media',n:ci.earned_media},{type:'other',n:ci.other}])}
      <h2 style="margin-top:16px">Sentiment gegenüber LogBATT</h2>
      ${sentTotal ? table([
        { title:'Sentiment', render:r=>r.k },
        { title:'Läufe', num:true, render:r=>r.n },
        { title:'Anteil', num:true, render:r=>pct1(r.n/sentTotal) },
        { title:'', render:r=>bar(r.n/sentTotal) },
      ], [{k:'positive',n:s.positive},{k:'neutral',n:s.neutral},{k:'negative',n:s.negative}])
        : '<div class="empty">Kein Sentiment in dieser Auswahl — die importierten Peec-Läufe enthalten keins.</div>'}
    </div>
  </div>`;
}

function viewPrompts() {
  if (DETAIL_PROMPT) return viewPromptDetail(DETAIL_PROMPT);
  const rows = promptTable(filtered());
  return `<div class="panel"><h2>Prompts (${rows.length}) — Klick öffnet die volle Antwort-Historie</h2>
    ${table([
      { title:'Prompt', render:r=>`<span class="clickable" onclick="openPrompt(${r.prompt_id})">${esc(r.prompt)}</span>` },
      { title:'Kategorie', render:r=>esc(r.category) },
      { title:'Land', render:r=>r.country },
      { title:'Läufe', num:true, render:r=>r.runs },
      { title:'Visibility', num:true, render:r=>pct(r.visibility) },
      { title:'', render:r=>bar(r.visibility) },
      { title:'Ø Pos.', num:true, render:r=>num(r.avg_position) },
      { title:'Problem-Narrativ', num:true, render:r=>r.anchored },
      { title:'Letzter Lauf', num:true, render:r=>r.last_run },
    ], rows)}</div>`;
}

function viewPromptDetail(id) {
  const p = PROMPT.get(id);
  const runs = filtered({ prompt_id:[id] }).slice().sort((a,b) =>
    b.d.localeCompare(a.d) || a.e.localeCompare(b.e));
  const body = runs.map(r => `
    <details>
      <summary>${r.d} · ${r.e} · ${r.m===1 ? `LogBATT Position ${r.pos ?? '?'}`
        : r.m===0 ? 'LogBATT nicht genannt' : 'noch nicht ausgewertet'}
        · ${r.c.length} Quellen <span class="hint">(${esc(r.s)})</span></summary>
      ${r.b.length ? `<div style="margin-top:8px"><strong>Marken in Reihenfolge:</strong> ${
        r.b.map(b => `${b[1]}. ${esc((BRAND.get(b[0])||{}).name)}${b[0]===OWN_ID?' ★':''}`).join(' · ')}</div>` : ''}
      <pre class="answer">${esc(r.t || '(keine Antwort gespeichert)')}</pre>
      ${r.c.length ? table([
        { title:'#', num:true, render:c=>c[4] },
        { title:'Domain', render:c=>esc(c[0]) },
        { title:'Typ', render:c=>tag(c[2]) },
        { title:'URL', render:c=>c[3]
            ? `<a href="${esc(c[1])}" target="_blank" rel="noopener">${esc(c[1])}</a>`
            : '<span class="hint">nur Domain bekannt</span>' },
      ], r.c) : '<div class="empty">Keine Quellen zitiert.</div>'}
    </details>`).join('');
  return `<div class="panel">
    <button onclick="DETAIL_PROMPT=null;render()">← zurück zur Prompt-Liste</button>
    <h2 style="margin-top:12px">${esc(p.text)}</h2>
    <div class="hint">${esc(p.cat)} · ${p.country}/${p.lang} · ${runs.length} Läufe in dieser Auswahl</div>
    <div style="margin-top:14px">${body || '<div class="empty">Keine Läufe in dieser Auswahl.</div>'}</div>
  </div>`;
}

function viewDomains() {
  const rows = domainRanking(filtered()).slice(0, 100), max = rows[0]?.citations || 1;
  return `<div class="panel"><h2>Domain-Dominanz (${rows.length}) — welche Quellen prägen die Antworten</h2>
    <div class="hint" style="margin-bottom:10px">Klick auf eine Domain filtert das gesamte Dashboard darauf.</div>
    ${table([
      { title:'Domain', render:r=>`<span class="clickable" onclick="filterDomain('${esc(r.domain)}')">${esc(r.domain)}</span>${r.is_known?'':'<span class="new"> NEU</span>'}` },
      { title:'Typ', render:r=>tag(r.source_type) },
      { title:'Zitate', num:true, render:r=>r.citations },
      { title:'', render:r=>bar(r.citations/max) },
      { title:'Läufe', num:true, render:r=>r.runs },
      { title:'Prompts', num:true, render:r=>r.prompts },
      { title:'Ø Rang im Quellenblock', num:true, render:r=>num(r.avg_rank,1) },
    ], rows)}</div>`;
}

function viewUrls() {
  const rows = urlRanking(filtered()).slice(0, 100);
  return `<div class="panel"><h2>Zitierte URLs (${rows.length})</h2>
    <div class="hint" style="margin-bottom:10px">Nur URL-genaue Quellen. Importierte Peec-Daten
      liefern ausschließlich Domains und erscheinen hier bewusst nicht.</div>
    ${table([
      { title:'URL', render:r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>` },
      { title:'Domain', render:r=>esc(r.domain) },
      { title:'Typ', render:r=>tag(r.source_type) },
      { title:'Zitate', num:true, render:r=>r.citations },
      { title:'Prompts', num:true, render:r=>r.prompts },
      { title:'Ø Rang', num:true, render:r=>num(r.avg_rank,1) },
    ], rows, { empty:'Keine URL-genauen Zitate in dieser Auswahl (nur Domain-Daten).' })}</div>`;
}

function viewGaps() {
  const rows = gapView(filtered()), gaps = rows.filter(r => !r.runs_with_owned);
  return `<div class="panel">
    <h2>Eigen-Domain-Gap — Prompts ohne ein einziges Zitat von logbatt.de/.com</h2>
    <div class="hint" style="margin-bottom:10px">Sortiert nach Relevanz: viele Läufe, keine eigene
      Domain, viele Wettbewerber-Zitate = höchste Priorität.</div>
    ${table([
      { title:'Prompt', render:r=>`<span class="clickable" onclick="openPrompt(${r.prompt_id})">${esc(r.prompt)}</span>` },
      { title:'Kategorie', render:r=>esc(r.category) },
      { title:'Läufe', num:true, render:r=>r.runs },
      { title:'Visibility', num:true, render:r=>pct(r.visibility) },
      { title:'Läufe mit Wettbewerber-Domain', num:true, render:r=>r.runs_with_competitor },
    ], gaps, { empty:'Kein Gap — in jedem Prompt dieser Auswahl wird eine eigene Domain zitiert.' })}
    <h2 style="margin-top:20px">Prompts MIT eigener Domain (${rows.length-gaps.length})</h2>
    ${table([
      { title:'Prompt', render:r=>`<span class="clickable" onclick="openPrompt(${r.prompt_id})">${esc(r.prompt)}</span>` },
      { title:'Läufe', num:true, render:r=>r.runs },
      { title:'davon mit eigener Domain', num:true, render:r=>r.runs_with_owned },
      { title:'Abdeckung', num:true, render:r=>pct(r.runs_with_owned/r.runs) },
      { title:'', render:r=>bar(r.runs_with_owned/r.runs) },
      { title:'Eigene Zitate', num:true, render:r=>r.owned_citations },
    ], rows.filter(r=>r.runs_with_owned))}</div>`;
}

function viewEarned() {
  const rows = domainRanking(filtered(), 'earned_media').slice(0,100), max = rows[0]?.citations || 1;
  return `<div class="panel"><h2>Earned Media — Foren, Vergleichs- und Referenzseiten (${rows.length})</h2>
    <div class="hint" style="margin-bottom:10px">Diese Quellen prägen die Antworten, ohne uns zu
      gehören. Hohe Zitatzahl = lohnendes Ziel für Präsenz.</div>
    ${table([
      { title:'Domain', render:r=>`<span class="clickable" onclick="filterDomain('${esc(r.domain)}')">${esc(r.domain)}</span>` },
      { title:'Zitate', num:true, render:r=>r.citations },
      { title:'', render:r=>bar(r.citations/max) },
      { title:'Läufe', num:true, render:r=>r.runs },
      { title:'Prompts', num:true, render:r=>r.prompts },
      { title:'Ø Rang', num:true, render:r=>num(r.avg_rank,1) },
    ], rows)}</div>`;
}

function viewBrands() {
  const rows = brandLeaderboard(filtered()).slice(0,60), max = rows[0]?.mentions || 1;
  return `<div class="panel"><h2>Marken-Leaderboard (${rows.length})</h2>
    <div class="hint" style="margin-bottom:10px">Klick auf eine Marke filtert auf Läufe, in denen sie vorkommt.</div>
    ${table([
      { title:'Marke', render:r=>`<span class="clickable" onclick="filterBrand(${r.brand_id})">${esc(r.name)}</span>`
        + (r.own?' ★':'') + (r.known?'':'<span class="new"> NEU</span>')
        + (!r.comp && !r.own ? ' <span class="hint">(Partner)</span>' : '') },
      { title:'Nennungen', num:true, render:r=>r.mentions },
      { title:'', render:r=>bar(r.mentions/max) },
      { title:'Share of Voice', num:true, render:r=>pct1(r.share_of_voice) },
      { title:'Visibility', num:true, render:r=>pct(r.visibility) },
      { title:'Ø Position', num:true, render:r=>num(r.avg_position) },
    ], rows)}</div>`;
}

function viewBreakdown() {
  const runs = filtered();
  const dims = [
    ['Kategorie', groupBy(runs, r => PROMPT.get(r.p).cat)],
    ['Land',      groupBy(runs, r => PROMPT.get(r.p).country)],
    ['Engine',    groupBy(runs, r => r.e)],
    ['Datenquelle', groupBy(runs, r => r.s)],
  ];
  return dims.map(([label, rows]) => `<div class="panel"><h2>Nach ${label}</h2>
    ${table([
      { title:label, render:r=>esc(r.label) },
      { title:'Läufe', num:true, render:r=>r.runs },
      { title:'Visibility', num:true, render:r=>pct(r.visibility) },
      { title:'', render:r=>bar(r.visibility) },
      { title:'Ø Position', num:true, render:r=>num(r.avg_position) },
      { title:'Problem-Narrativ', num:true, render:r=>r.anchored },
    ], rows)}</div>`).join('');
}

function viewDiscovered() {
  const d = discoveries(filtered());
  return `<div class="grid2">
    <div class="panel"><h2>Neu entdeckte Domains (${d.domains.length})</h2>
      <div class="hint" style="margin-bottom:10px">Zitierte Domains, die in keinem Seed stehen —
        Kandidaten für die Einordnung als Wettbewerber oder Earned Media.</div>
      ${table([
        { title:'Domain', render:r=>`<span class="clickable" onclick="filterDomain('${esc(r.domain)}')">${esc(r.domain)}</span>` },
        { title:'Typ', render:r=>tag(r.source_type) },
        { title:'Zitate', num:true, render:r=>r.citations },
        { title:'Erstmals am', num:true, render:r=>r.first_run_date },
      ], d.domains.slice(0,80))}</div>
    <div class="panel"><h2>Neu entdeckte Marken (${d.brands.length})</h2>
      ${table([
        { title:'Marke', render:r=>esc(r.name) },
        { title:'Erstmals gesehen', num:true, render:r=>(r.seen||'').slice(0,10) },
      ], d.brands, { empty:'Keine unbekannten Marken — alle Nennungen sind geseedet.' })}</div>
  </div>`;
}

const VIEWS = { overview:viewOverview, prompts:viewPrompts, domains:viewDomains, urls:viewUrls,
                gaps:viewGaps, earned:viewEarned, brands:viewBrands, breakdown:viewBreakdown,
                discovered:viewDiscovered };

window.openPrompt   = id => { DETAIL_PROMPT = id; TAB = 'prompts'; render(); };
window.filterDomain = d  => { F.domain = [d]; DETAIL_PROMPT = null; renderFilters(); render(); };
window.filterBrand  = id => { F.brand_id = [id]; DETAIL_PROMPT = null; renderFilters(); render(); };

// --- Filterleiste ----------------------------------------------------------
function uniq(list) { return [...new Set(list)].sort(); }

function renderFilters() {
  const cited = new Map();
  for (const r of D.runs) for (const c of r.c) cited.set(c[0], (cited.get(c[0])||0)+1);
  const domains = [...cited.entries()].sort((a,b)=>b[1]-a[1]).slice(0,200);
  const usedBrands = new Set(D.runs.flatMap(r => r.b.map(b => b[0])));

  const multi = (key,label,options,value=o=>o,text=o=>o) => `
    <div class="f"><label>${label}</label>
      <select multiple data-key="${key}">
        ${options.map(o=>`<option value="${esc(value(o))}"${
          F[key].map(String).includes(String(value(o)))?' selected':''}>${esc(text(o))}</option>`).join('')}
      </select></div>`;

  document.getElementById('filters').innerHTML = `
    <div class="f"><label>Von</label><input type="date" id="since" value="${F.since||''}"></div>
    <div class="f"><label>Bis</label><input type="date" id="until" value="${F.until||''}"></div>
    ${multi('engine','Engine', uniq(D.runs.map(r=>r.e)))}
    ${multi('country','Land', uniq(D.prompts.map(p=>p.country)))}
    ${multi('language','Sprache', uniq(D.prompts.map(p=>p.lang)))}
    ${multi('category','Kategorie', uniq(D.prompts.map(p=>p.cat)))}
    ${multi('source','Datenquelle', uniq(D.runs.map(r=>r.s)))}
    ${multi('brand_id','Marke / Wettbewerber', D.brands.filter(b=>usedBrands.has(b.id)),
            b=>b.id, b=>b.name + (b.own?' (eigene)':b.known?'':' ·neu'))}
    ${multi('domain','Zitierte Domain', domains, d=>d[0], d=>`${d[0]} (${d[1]})`)}
    ${multi('prompt_id','Prompt', D.prompts, p=>p.id,
            p=>p.text.length>46 ? p.text.slice(0,46)+'…' : p.text)}
    <div class="f"><label>Zitierte URL (exakt)</label>
      <input type="text" id="url" placeholder="https://…" value="${esc(F.url||'')}"></div>
    <div class="filter-actions">
      <button class="primary" id="apply">Filter anwenden</button>
      <button id="reset">Zurücksetzen</button>
      <span class="hint">Facetten sind UND-verknüpft · Mehrfachauswahl mit Strg/Cmd</span>
      <span class="hint" id="scope"></span>
    </div>`;

  document.getElementById('apply').onclick = () => {
    F.since = document.getElementById('since').value || null;
    F.until = document.getElementById('until').value || null;
    F.url   = document.getElementById('url').value.trim() || null;
    document.querySelectorAll('#filters select[multiple]').forEach(sel => {
      F[sel.dataset.key] = [...sel.selectedOptions].map(o =>
        sel.dataset.key.endsWith('_id') ? Number(o.value) : o.value);
    });
    DETAIL_PROMPT = null; render();
  };
  document.getElementById('reset').onclick = () => {
    const days = D.runs.map(r=>r.d).sort();
    Object.assign(F, { since:days[0], until:days[days.length-1], engine:[], country:[],
      language:[], category:[], source:[], brand_id:[], domain:[], prompt_id:[], url:null });
    DETAIL_PROMPT = null; renderFilters(); render();
  };
}

function render() {
  document.getElementById('tabs').innerHTML = Object.entries(TABS).map(([k,label]) =>
    `<button aria-selected="${TAB===k}" onclick="TAB='${k}';DETAIL_PROMPT=null;render()">${label}</button>`).join('');
  const active = Object.values(F).filter(v =>
    v !== null && v !== '' && (!Array.isArray(v) || v.length)).length;
  const scope = document.getElementById('scope');
  if (scope) scope.textContent = `${active} Filter aktiv`;
  try { document.getElementById('view').innerHTML = VIEWS[TAB](); }
  catch (err) { document.getElementById('view').innerHTML = `<div class="empty">Fehler: ${esc(err.message)}</div>`; }
}

(function init() {
  const days = D.runs.map(r => r.d).sort();
  F.since = days[0]; F.until = days[days.length-1];
  document.getElementById('status').textContent =
    `${D.runs.length} Läufe · ${F.since} bis ${F.until}`;
  document.getElementById('snapshot').innerHTML =
    `<strong>Schnappschuss</strong> vom ${esc(D.generated_at.slice(0,16).replace('T',' '))} UTC ·
     ${D.runs.length} beantwortete Läufe, ${D.prompts.length} Prompts, ${D.brands.length} Marken.
     Alle Filter und Kennzahlen rechnen hier im Browser — diese Datei ruft nichts ab.
     Neue Daten holt <code>geotracker ingest</code>, danach neu exportieren.`;
  renderFilters();
  render();
})();
</script>
</body>
</html>
