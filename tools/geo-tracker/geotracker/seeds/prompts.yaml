# Prompt-Seed für den GEO-Visibility-Tracker (Ebene 1).
#
# Quelle: data/peec/prompts-master-2026-08-03.md — die 79 aktiv getrackten,
# nicht-marken-bezogenen Prompts aus dem LogBATT-Peec-Account, 1:1 übernommen,
# damit unsere Zahlen direkt gegen Peec gegengeprüft werden können.
#
# category  = Peec-`topic_name` (Themen-Cluster), unverändert.
# country   = ISO-3166-1 alpha-2. ACHTUNG: keine der vier SearchApi-KI-Engines
#             nimmt einen Location-Parameter entgegen (siehe README, Abschnitt
#             "Land & Sprache"). `country` ist deshalb heute eine Auswertungs-
#             Dimension, kein Request-Parameter.
# language  = ISO-639-1. Wird über die Sprache des Prompt-Textes gesteuert
#             (SearchApi antwortet in der Sprache der Query — dokumentiert).
# engines   = Engines, gegen die dieser Prompt laufen soll.
#
# Der Seed ist idempotent: `geotracker seed` legt fehlende Prompts an und
# aktualisiert category/engines bestehender, löscht aber nie.

defaults:
  country: DE
  language: de
  engines: [chatgpt, perplexity, gemini, google_ai_overview]
  active: true

